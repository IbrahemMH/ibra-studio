<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flow Wellness · Ibra Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Quicksand:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
:root{--display:'Quicksand';--body:'Inter';--bg:#f4f1ec;--text:#1e2a24;--muted:#6b7a70;--card:#ffffff;--line:rgba(30,42,36,.08);--accent:#2f6f5e;--accent-light:#d9ebe3;--on-accent:#fff;--max:1080px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body),system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh;overflow-x:hidden}
html[dir="rtl"] body{font-family:"IBM Plex Sans Arabic",var(--body),system-ui,sans-serif}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%;height:100%;object-fit:cover}
.wrap{width:min(100% - 2rem,var(--max,1040px));margin:0 auto}

/* topbar shared */
.topbar{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:.55rem 1rem;background:rgba(244,241,236,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.back{font-size:.85rem;font-weight:600;opacity:.8}
.toggles{display:flex;gap:.45rem;align-items:center;flex-wrap:wrap}
.lang,.currency-toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:rgba(0,0,0,.04)}
.lang-btn,.currency-toggle button{border:0;background:transparent;color:var(--muted);padding:.32rem .65rem;cursor:pointer;font-weight:700;font-size:.78rem}
.lang-btn.active,.currency-toggle button.active{background:var(--accent-light);color:var(--accent)}
nav.site{display:flex;justify-content:space-between;align-items:center;padding:1.1rem 0;gap:1rem}
.brand{font-family:var(--display);font-weight:700;font-size:1.3rem;letter-spacing:-.02em;color:var(--accent)}
.nav-links{display:flex;gap:1rem;list-style:none;color:var(--muted);font-size:.9rem;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:.72rem 1.2rem;font-weight:700;font-size:.92rem;border:0;cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn-a{background:var(--accent);color:var(--on-accent)}
.btn-g{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn-g:hover{background:rgba(47,111,94,.04)}

/* hero — full rounded image with breathing text */
.hero{position:relative;margin-bottom:1.5rem}
.hero-visual{position:relative;border-radius:28px;overflow:hidden;min-height:420px;background:var(--accent-light)}
.hero-visual img{width:100%;height:420px;object-fit:cover}
.hero-visual::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(47,111,94,.15),transparent 40%,rgba(0,0,0,.2) 100%)}
.hero-overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:2.5rem 2rem;z-index:2}
.hero-overlay .kicker{display:inline-block;background:rgba(255,255,255,.2);backdrop-filter:blur(6px);color:#fff;font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:.3rem .8rem;border-radius:999px;margin-bottom:1rem;align-self:flex-start}
.hero-overlay h1{font-family:var(--display);font-size:clamp(2.4rem,5vw,3.6rem);color:#fff;line-height:1.1;letter-spacing:-.02em;margin-bottom:.6rem;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
.hero-overlay .lead{color:rgba(255,255,255,.85);font-size:1rem;max-width:28rem;margin-bottom:1.2rem}
.hero-cta{display:flex;flex-wrap:wrap;gap:.6rem}
.hero-cta .btn-a{background:#fff;color:var(--accent);box-shadow:0 4px 20px rgba(0,0,0,.12)}
.hero-cta .btn-g{border-color:rgba(255,255,255,.3);color:#fff}

/* section headings */
.section{padding:1.8rem 0 3rem}
.section-head{text-align:center;margin-bottom:1.8rem}
.section-head h2{font-family:var(--display);font-size:clamp(1.5rem,2.8vw,2rem);color:var(--accent);letter-spacing:-.02em}
.section-head p{color:var(--muted);margin-top:.4rem;font-size:.9rem}

/* blob cards — horizontal scroll snap */
.scroll-x{display:flex;gap:1.2rem;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:.8rem;scrollbar-width:thin;scrollbar-color:var(--accent-light) transparent}
.scroll-x::-webkit-scrollbar{height:5px}
.scroll-x::-webkit-scrollbar-track{background:transparent}
.scroll-x::-webkit-scrollbar-thumb{background:var(--accent-light);border-radius:999px}
.blob-card{scroll-snap-align:start;flex:0 0 310px;background:var(--card);border-radius:26px;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.blob-card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(47,111,94,.1)}
.blob-card .card-img{aspect-ratio:16/12;overflow:hidden}
.blob-card .card-img img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.blob-card:hover .card-img img{transform:scale(1.05)}
.blob-card .card-body{padding:1rem 1.1rem 1.2rem;flex:1;display:flex;flex-direction:column}
.blob-card h3{font-family:var(--display);font-size:1.1rem;color:var(--accent);margin-bottom:.2rem}
.blob-card p{color:var(--muted);font-size:.87rem;flex:1}
.price{display:block;font-weight:700;color:var(--accent);margin-top:.5rem;font-size:1rem}

/* rounded info section */
.info-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:1rem}
.info-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:1.25rem;text-align:center}
.info-card .icon{font-size:1.6rem;margin-bottom:.4rem;display:block}
.info-card h4{font-family:var(--display);font-size:.95rem;color:var(--accent);margin-bottom:.2rem}
.info-card p{color:var(--muted);font-size:.82rem}

/* brand kit shared */
.brand-kit{margin:1rem 0 2.5rem;padding:1.25rem;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.brand-kit h2{font-family:var(--display);font-size:1.25rem;margin-bottom:.85rem;color:var(--accent)}
.brand-row{margin-bottom:1rem}
.brand-row:last-child{margin-bottom:0}
.brand-label{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:.45rem}
.font-lines{display:grid;gap:.35rem;font-size:.95rem}
.font-lines strong{color:var(--accent)}
.swatches{display:flex;flex-wrap:wrap;gap:.75rem}
.swatch{display:flex;align-items:center;gap:.5rem;min-width:140px}
.swatch-sq{width:28px;height:28px;border-radius:7px;border:1px solid rgba(128,128,128,.25);flex-shrink:0}
.swatch-meta{display:flex;flex-direction:column;line-height:1.25}
.swatch-name{font-size:.82rem;font-weight:600}
.swatch-hex{font-size:.75rem;color:var(--muted);font-family:ui-monospace,monospace}
.footer{border-top:1px solid var(--line);padding:1.3rem 0 2rem;color:var(--muted);font-size:.88rem;display:flex;flex-wrap:wrap;justify-content:space-between;gap:.6rem}

/* scroll reveal */
.reveal{opacity:0;transform:translateY(20px);transition:opacity .5s ease,transform .5s ease}
.reveal.visible{opacity:1;transform:translateY(0)}

@media(max-width:800px){
  .info-row{grid-template-columns:1fr}
  .blob-card{flex:0 0 260px}
  .hero-overlay{padding:1.5rem}
  .nav-links{display:none}
}
  </style>
</head>
<body>

          <div class="card-img"><img src="../../assets/images/wellness/card3.jpg" alt="" loading="lazy" /></div>
          <div class="card-body"><h3 data-i18n="c3t"></h3><p data-i18n="c3p"></p><span class="price money-price" data-jod="39"></span></div>

    <footer class="footer">

  </div>
  <script src="../shared/lang.js"></script>
  <script src="../../js/currency.js"></script>
  <script>
    var DICT = {"en": {"back": "← Ibra Studio", "nav1": "Classes", "nav2": "Schedule", "nav3": "Pricing", "nav4": "Book", "kicker": "Wellness · Amman", "h1": "Find your<span>flow.</span>", "lead": "Yoga, pilates, and breathwork in a light-filled studio designed for calm.", "cta1": "Try a free class", "cta2": "View schedule", "hi1t": "Yoga & Pilates", "hi1p": "Daily sessions for all levels from beginner to advanced.", "hi2t": "Holistic Wellness", "hi2p": "Breathwork, meditation, and mindful movement combined.", "hi3t": "Flexible Hours", "hi3p": "Early morning to evening — fit wellness into your day.", "s_title": "Popular classes", "s_sub": "Swipe or scroll through our most-loved sessions.", "c1t": "Sunrise Flow", "c1p": "Gentle vinyasa to start your day with intention.", "c2t": "Power Pilates", "c2p": "Core-strengthening mat work for endurance and posture.", "c3t": "Breath & Restore", "c3p": "Slow yin with breathwork — deep release.", "c4t": "Private Session", "c4p": "One-on-one coaching tailored to your body.", "suffix": " / session", "brand_title": "Brand kit", "fonts_label": "Fonts", "colors_label": "Colors", "font_roles": "Headings", "foot": "Flow Wellness · Ibra Studio template"}, "ar": {"back": "← Ibra Studio", "nav1": "الحصص", "nav2": "الجدول", "nav3": "الأسعار", "nav4": "احجز", "kicker": "ويلنس · عمّان", "h1": "اعثر على<span>تدفقك.</span>", "lead": "يوغا وبيلاتس وتمارين تنفس في استوديو مليء بالضوء مصمم للهدوء.", "cta1": "جرب حصة مجانية", "cta2": "عرض الجدول", "hi1t": "يوغا وبيلاتس", "hi1p": "جلسات يومية لجميع المستويات من المبتدئ إلى المتقدم.", "hi2t": "عافية شاملة", "hi2p": "تمارين تنفس وتأمل وحركة واعية مجتمعة.", "hi3t": "ساعات مرنة", "hi3p": "من الصباح الباكر حتى المساء — ناسب العافية في يومك.", "s_title": "الحصص الشائعة", "s_sub": "اسحب أو مرر عبر حصصنا الأكثر حباً.", "c1t": "تدفق الشروق", "c1p": "فينياسا لطيفة لبدء يومك بنية.", "c2t": "بيلاتس القوة", "c2p": "تمارين تقوية الجذع للتحمل والوضعية.", "c3t": "تنفس واسترخاء", "c3p": "يين بطيء مع تمارين تنفس — تحرر عميق.", "c4t": "جلسة خاصة", "c4p": "تدريب فردي مصمم خصيصاً لجسمك.", "suffix": " / جلسة", "brand_title": "هوية العلامة", "fonts_label": "الخطوط", "colors_label": "الألوان", "font_roles": "العناوين", "foot": "فلاو ويلنس · قالب Ibra Studio"}};
    var COLORS = [{"hex": "#f4f1ec", "en": "Warm cream", "ar": "كريمي دافئ"}, {"hex": "#2f6f5e", "en": "Forest teal", "ar": "غابي فيروزي"}, {"hex": "#d9ebe3", "en": "Mint wash", "ar": "غسول نعناعي"}, {"hex": "#6b7a70", "en": "Sage gray", "ar": "رمادي مريمي"}, {"hex": "#ffffff", "en": "Pure white", "ar": "أبيض نقي"}];

    function observeReveal() {
      document.querySelectorAll(".reveal").forEach(function (el) {
        var obs = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (e.isIntersecting) { el.classList.add("visible"); obs.unobserve(el); }
          });
        }, {threshold: 0.1});
        obs.observe(el);
      });
    }
    function paintColorNames(lang) {
      document.querySelectorAll("[data-color-en]").forEach(function (el) {
        el.textContent = lang === "ar" ? el.getAttribute("data-color-ar") : el.getAttribute("data-color-en");
      });
    }
    function applySuffix() {
      var lang = document.documentElement.lang === "ar" ? "ar" : "en";
      var suf = (DICT[lang] && DICT[lang].suffix) || "";
      document.querySelectorAll(".money-price").forEach(function (el) {
        el.setAttribute("data-suffix", suf);
      });
      if (window.IbraMoney) IbraMoney.applyAll();
    }
    var _init = IbraLang.init;
    IbraLang.init = function (dict) {
      _init(dict);
      paintColorNames(document.documentElement.lang === "ar" ? "ar" : "en");
      applySuffix();
      document.querySelectorAll(".lang-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          setTimeout(function () {
            paintColorNames(btn.getAttribute("data-lang"));
            applySuffix();
          }, 0);
        });
      });
    };
    IbraLang.init(DICT);
    document.addEventListener("ibra-currency", applySuffix);
    observeReveal();
  </script>
