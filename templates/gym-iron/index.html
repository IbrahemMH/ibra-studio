<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iron Forge Gym · Ibra Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Oswald:wght@500;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
:root{--display:'Oswald';--body:'Inter';--bg:#08080a;--text:#f0f2f5;--muted:#8a8f9a;--card:#111215;--line:rgba(255,255,255,.08);--accent:#ef4444;--accent-dim:#a32828;--on-accent:#fff;--max:1080px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body),system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh;overflow-x:hidden}
html[dir="rtl"] body{font-family:"IBM Plex Sans Arabic",var(--body),system-ui,sans-serif}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%;height:100%;object-fit:cover}
.wrap{width:min(100% - 2rem,var(--max,1040px));margin:0 auto}

/* topbar shared */
.topbar{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:.55rem 1rem;background:rgba(0,0,0,.6);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.back{font-size:.85rem;font-weight:600;opacity:.9}
.toggles{display:flex;gap:.45rem;align-items:center;flex-wrap:wrap}
.lang,.currency-toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:rgba(0,0,0,.25)}
.lang-btn,.currency-toggle button{border:0;background:transparent;color:var(--muted);padding:.32rem .65rem;cursor:pointer;font-weight:700;font-size:.78rem}
.lang-btn.active,.currency-toggle button.active{background:rgba(255,255,255,.1);color:var(--accent)}

/* unique hero - diagonal split */
.hero{position:relative;min-height:90vh;display:flex;align-items:center;overflow:hidden}
.hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 0% 50%,rgba(239,68,68,.08),transparent 60%),radial-gradient(ellipse 50% 40% at 100% 100%,rgba(0,0,0,.6),transparent 50%)}
.hero-inner{position:relative;z-index:2;display:grid;grid-template-columns:1.1fr .9fr;gap:2rem;align-items:center;width:min(100% - 2rem,var(--max));margin:0 auto;padding:4rem 0}
.hero-text .kicker{display:inline-block;color:var(--accent);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.7rem;border:1px solid rgba(239,68,68,.25);border-radius:999px;padding:.3rem .8rem;margin-bottom:1rem;background:rgba(239,68,68,.06)}
.hero-text h1{font-family:var(--display);font-size:clamp(2.6rem,5.5vw,4rem);line-height:1.05;text-transform:uppercase;letter-spacing:-.02em;margin-bottom:.7rem}
.hero-text h1 span{display:block;background:linear-gradient(135deg,var(--accent),var(--accent-dim));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-text .lead{color:var(--muted);font-size:1.02rem;margin-bottom:1.6rem;max-width:32rem}
.hero-cta{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:1.6rem}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:.72rem 1.2rem;font-weight:700;font-size:.92rem;border:0;cursor:pointer;transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-2px)}
.btn-a{background:var(--accent);color:var(--on-accent);box-shadow:0 8px 28px rgba(239,68,68,.3)}
.btn-g{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn-g:hover{background:rgba(255,255,255,.04)}
.hero-stats{display:flex;gap:1.8rem;flex-wrap:wrap}
.stat{text-align:center}
.stat-num{font-family:var(--display);font-size:1.6rem;color:var(--accent);line-height:1}
.stat-num span{font-size:.8rem;color:var(--muted);font-family:var(--body)}
.stat-label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:.2rem}

/* hero image with diagonal clip */
.hero-visual{position:relative;height:100%;min-height:450px}
.hero-img-wrap{position:absolute;inset:0;clip-path:polygon(8% 0,100% 0,100% 100%,0% 100%);border-radius:0;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.hero-img-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.hero-img-wrap:hover img{transform:scale(1.04)}
.hero-img-wrap::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(239,68,68,.12),transparent 50%)}

/* membership section - staggered cards */
.section{padding:1.8rem 0 3.5rem}
.section-head{text-align:center;margin-bottom:2rem}
.section-head h2{font-family:var(--display);font-size:clamp(1.6rem,3vw,2.2rem);text-transform:uppercase;letter-spacing:-.02em}
.section-head p{color:var(--muted);max-width:28rem;margin:.5rem auto 0;font-size:.92rem}

/* staggered diagonal card layout */
.stagger{display:flex;flex-direction:column;gap:1.2rem;max-width:860px;margin:0 auto}
.card-row{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;align-items:center}
.card-row:nth-child(2){margin-left:2.5rem}
.card-row:nth-child(3){margin-left:0}
.card-row:nth-child(4){margin-right:2.5rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s;cursor:default}
.card:hover{transform:perspective(800px) rotateX(2deg) rotateY(-3deg) scale(1.02);box-shadow:0 20px 50px rgba(0,0,0,.3)}
.card-row:nth-child(odd) .card:hover{transform:perspective(800px) rotateX(2deg) rotateY(3deg) scale(1.02)}
.card-img{aspect-ratio:16/10;overflow:hidden;border-bottom:1px solid var(--line)}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.card:hover .card-img img{transform:scale(1.06)}
.card-body{padding:1rem 1.1rem 1.2rem;flex:1;display:flex;flex-direction:column}
.card h3{font-family:var(--display);font-size:1.15rem;text-transform:uppercase;letter-spacing:-.01em;margin-bottom:.25rem}
.card p{color:var(--muted);font-size:.87rem;flex:1;margin-bottom:.5rem}
.price{display:block;font-weight:800;color:var(--accent);font-size:1.1rem}
.card-badge{display:inline-block;background:rgba(239,68,68,.12);color:var(--accent);font-size:.65rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:.2rem .5rem;border-radius:999px;margin-bottom:.5rem;align-self:flex-start}

/* brand kit shared */
.brand-kit{margin:1rem 0 2.5rem;padding:1.25rem;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.brand-kit h2{font-family:var(--display);font-size:1.25rem;margin-bottom:.85rem;text-transform:uppercase}
.brand-row{margin-bottom:1rem}
.brand-row:last-child{margin-bottom:0}
.brand-label{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:.45rem}
.font-lines{display:grid;gap:.35rem;font-size:.95rem}
.font-lines strong{color:var(--accent)}
.swatches{display:flex;flex-wrap:wrap;gap:.75rem}
.swatch{display:flex;align-items:center;gap:.5rem;min-width:140px}
.swatch-sq{width:28px;height:28px;border-radius:7px;border:1px solid rgba(128,128,128,.45);flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.swatch-meta{display:flex;flex-direction:column;line-height:1.25}
.swatch-name{font-size:.82rem;font-weight:600}
.swatch-hex{font-size:.75rem;color:var(--muted);font-family:ui-monospace,monospace}
.footer{border-top:1px solid var(--line);padding:1.3rem 0 2rem;color:var(--muted);font-size:.88rem;display:flex;flex-wrap:wrap;justify-content:space-between;gap:.6rem}

/* nav shared */
nav.site{display:flex;justify-content:space-between;align-items:center;padding:1.1rem 0;gap:1rem}
.brand{font-family:var(--display);font-weight:700;font-size:1.3rem;letter-spacing:-.02em;text-transform:uppercase}
.nav-links{display:flex;gap:1rem;list-style:none;color:var(--muted);font-size:.9rem;flex-wrap:wrap}

/* scroll reveal */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .5s ease,transform .5s ease}
.reveal.visible{opacity:1;transform:translateY(0)}

@media(max-width:800px){
  .hero-inner{grid-template-columns:1fr;padding:2rem 0}
  .hero{min-height:auto}
  .hero-visual{min-height:280px;order:-1}
  .hero-img-wrap{position:relative;clip-path:none;border-radius:16px;min-height:280px}
  .hero-stats{justify-content:center}
  .card-row{grid-template-columns:1fr;margin-left:0!important;margin-right:0!important}
  .nav-links{display:none}
}
  </style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="../../index.html" data-i18n="back">← Ibra Studio</a>
    <div class="toggles">
      <div class="lang" aria-label="Language">

  <!-- unique hero: diagonal split + stats -->
  <section class="hero">
    <div class="hero-bg"></div>
    <div class="hero-inner">
      <div class="hero-text">
        <div class="kicker" data-i18n="kicker"></div>
        <h1 data-i18n-html="h1"></h1>

        <div class="hero-cta">

  <div class="wrap">

    <section class="section">

          </article>

        <div class="card-row reveal">
          <article class="card">

            <div class="card-body"><span class="card-badge" data-i18n="b3"></span><h3 data-i18n="c3t"></h3><p data-i18n="c3p"></p><span class="price money-price" data-jod="79"></span></div>

    <section class="brand-kit" id="brand-kit">

        <div class="swatch">
          <span class="swatch-sq" style="background:#08080a" title="#08080a"></span>

  <script src="../shared/lang.js"></script>
  <script src="../../js/currency.js"></script>
  <script>
    var DICT = {"en": {"back": "← Ibra Studio", "nav1": "Classes", "nav2": "Trainers", "nav3": "Pricing", "nav4": "Join", "kicker": "Amman · Strength · 24/7", "h1": "Forge a stronger<span>you.</span>", "lead": "Serious training floor - power racks, coaches, memberships built for results.", "cta1": "Start free week", "cta2": "View classes", "s_title": "Memberships", "s_sub": "Pick the plan that fits your training.", "s1": "Active members", "s2": "Hour access", "s3": "Pro coaches", "b1": "Best starter", "b2": "Most popular", "b3": "Elite", "c1t": "Starter", "c1p": "Gym floor access, locker, and basic equipment.", "c2t": "Athlete", "c2p": "All classes, coach check-ins, and nutrition guide.", "c3t": "Elite", "c3p": "Unlimited everything, guest passes, and priority coaching.", "suffix": " / mo", "brand_title": "Brand kit", "fonts_label": "Fonts", "colors_label": "Colors", "font_roles": "Headings", "foot": "Iron Forge Gym · Ibra Studio template"}, "ar": {"back": "← Ibra Studio", "nav1": "الحصص", "nav2": "المدربين", "nav3": "الأسعار", "nav4": "انضم", "kicker": "عمّان · قوة · 24/7", "h1": "اصنع نسخة<span>أقوى</span>منك.", "lead": "صالة تدريب جادة - أجهزة قوة ومدربين وعضويات للنتائج.", "cta1": "أسبوع مجاني", "cta2": "عرض الحصص", "s_title": "العضويات", "s_sub": "اختر الخطة التي تناسب تدريبك.", "s1": "عضو نشط", "s2": "ساعة الوصول", "s3": "مدرب محترف", "b1": "أفضل بداية", "b2": "الأكثر رواجاً", "b3": "نخبة", "c1t": "مبتدئ", "c1p": "صالة رياضية وخزانة ومعدات أساسية.", "c2t": "رياضي", "c2p": "جميع الحصص ومتابعة مدرب ودليل تغذية.", "c3t": "نخبة", "c3p": "كل شيء بلا حدود وتذاكر ضيوف وتدريب أولوية.", "suffix": " / شهر", "brand_title": "هوية العلامة", "fonts_label": "الخطوط", "colors_label": "الألوان", "font_roles": "العناوين", "foot": "آيرون فورج · قالب Ibra Studio"}};
    var COLORS = [{"hex": "#08080a", "en": "Pitch black", "ar": "أسود حالك"}, {"hex": "#ef4444", "en": "Forge red", "ar": "أحمر القوة"}, {"hex": "#f0f2f5", "en": "Steel white", "ar": "أبيض فولاذي"}, {"hex": "#8a8f9a", "en": "Anvil gray", "ar": "رمادي السندان"}, {"hex": "#111215", "en": "Iron card", "ar": "بطاقة حديدية"}];

    /* count-up on scroll */
    function countUp(el, target, suffix) {
      var current = 0, step = Math.ceil(target / 40);
      function tick() {
        current += step;
        if (current >= target) { el.textContent = target + suffix; return; }
        el.textContent = current + suffix;
        requestAnimationFrame(tick);
      }
      tick();
    }
    function observeCounters() {
      document.querySelectorAll("[data-count]").forEach(function (el) {
        var target = parseInt(el.getAttribute("data-count"), 10);
        var suffix = el.querySelector("span") ? el.querySelector("span").textContent : "";
        var obs = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (e.isIntersecting) {
              countUp(el, target, suffix);
              obs.unobserve(el);
            }
          });
        }, {threshold: 0.5});
        obs.observe(el);
      });
    }
    function observeReveal() {
      document.querySelectorAll(".reveal").forEach(function (el, i) {
        var obs = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (e.isIntersecting) {
              setTimeout(function () { el.classList.add("visible"); }, (i % 3) * 120);
              obs.unobserve(el);
            }
          });
        }, {threshold: 0.15});
        obs.observe(el);
      });
    }

    function paintColorNames(lang) {
      document.querySelectorAll("[data-color-en]").forEach(function (el) {
        el.textContent = lang === "ar" ? el.getAttribute("data-color-ar") : el.getAttribute("data-color-en");
      });
    }
    function applySuffix() {
      var lang = document.documentElement.lang === "ar" ? "ar" : "en";
      var suf = (DICT[lang] && DICT[lang].suffix) || "";
      document.querySelectorAll(".money-price").forEach(function (el) {
        el.setAttribute("data-suffix", suf);
      });
      if (window.IbraMoney) IbraMoney.applyAll();
    }
    var _init = IbraLang.init;
    IbraLang.init = function (dict) {
      _init(dict);
      paintColorNames(document.documentElement.lang === "ar" ? "ar" : "en");
      applySuffix();
      document.querySelectorAll(".lang-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          setTimeout(function () {
            paintColorNames(btn.getAttribute("data-lang"));
            applySuffix();
          }, 0);
        });
      });
    };
    IbraLang.init(DICT);
    document.addEventListener("ibra-currency", applySuffix);
    observeCounters();
    observeReveal();
  </script>
