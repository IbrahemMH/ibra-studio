<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovaPulse SaaS · Ibra Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
:root{--display:'Inter';--body:'Inter';--bg:#07080f;--text:#eef1f7;--muted:#7a80a0;--card:#11131f;--line:rgba(238,241,247,.06);--accent:#7c5cff;--accent-dim:#5a3fff;--accent-bg:rgba(124,92,255,.08);--on-accent:#fff;--max:1080px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body),system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;overflow-x:hidden}
html[dir="rtl"] body{font-family:"IBM Plex Sans Arabic",var(--body),system-ui,sans-serif}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%;height:100%;object-fit:cover}
.wrap{width:min(100% - 2rem,var(--max,1040px));margin:0 auto}
.topbar{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:.55rem 1rem;background:rgba(7,8,15,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.back{font-size:.85rem;font-weight:600;opacity:.8}
.toggles{display:flex;gap:.45rem;align-items:center;flex-wrap:wrap}
.lang,.currency-toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:rgba(0,0,0,.2)}
.lang-btn,.currency-toggle button{border:0;background:transparent;color:var(--muted);padding:.32rem .65rem;cursor:pointer;font-weight:700;font-size:.78rem}
.lang-btn.active,.currency-toggle button.active{background:var(--accent);color:#fff}
nav.site{display:flex;justify-content:space-between;align-items:center;padding:1.1rem 0;gap:1rem}
.brand{font-weight:800;font-size:1.3rem;letter-spacing:-.04em;color:var(--accent)}
.nav-links{display:flex;gap:1rem;list-style:none;color:var(--muted);font-size:.9rem;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:.72rem 1.2rem;font-weight:600;font-size:.92rem;border:0;cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn-a{background:var(--accent);color:var(--on-accent)}
.btn-g{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn-b{background:rgba(124,92,255,.12);color:var(--accent);border:1px solid transparent}

/* hero with floating shapes */
.hero{position:relative;padding:5rem 0 4rem;text-align:center;overflow:hidden}
.shapes{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.shape{position:absolute;border-radius:50%;opacity:.08;animation:floatShape 8s ease-in-out infinite}
.shape:nth-child(1){width:120px;height:120px;background:var(--accent);top:10%;left:10%;animation-delay:0s}
.shape:nth-child(2){width:80px;height:80px;background:var(--accent-dim);top:20%;right:15%;animation-delay:1.5s}
.shape:nth-child(3){width:160px;height:160px;background:var(--accent);bottom:5%;left:20%;animation-delay:3s}
.shape:nth-child(4){width:60px;height:60px;background:var(--accent-dim);bottom:30%;right:10%;animation-delay:2s;border-radius:4px;transform:rotate(45deg)}
.shape:nth-child(5){width:100px;height:100px;background:var(--accent);top:50%;left:80%;animation-delay:4s;border-radius:4px;transform:rotate(15deg)}
@keyframes floatShape{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-30px) rotate(5deg)}}
.hero-inner{position:relative;z-index:2;max-width:680px;margin:0 auto}
.hero-inner .kicker{display:inline-block;background:var(--accent-bg);color:var(--accent);font-size:.7rem;font-weight:700;padding:.35rem .8rem;border-radius:999px;margin-bottom:.8rem;border:1px solid rgba(124,92,255,.1)}
.hero-inner h1{font-weight:800;font-size:clamp(2.2rem,5vw,3.5rem);line-height:1.08;letter-spacing:-.04em;margin-bottom:.6rem}
.hero-inner h1 span{background:linear-gradient(135deg,var(--accent),#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-inner .lead{color:var(--muted);font-size:1.02rem;margin-bottom:1.5rem;max-width:480px;margin-left:auto;margin-right:auto}
.hero-cta{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-bottom:1.5rem}
.hero-metrics{display:flex;justify-content:center;gap:2.5rem;flex-wrap:wrap}
.hero-metrics .hm{text-align:center}
.hero-metrics .hm-val{font-weight:800;font-size:1.5rem;color:var(--accent);letter-spacing:-.02em}
.hero-metrics .hm-label{font-size:.75rem;color:var(--muted)}

/* features grid */
.section{padding:3rem 0 3rem}
.section-head{text-align:center;margin-bottom:2rem}
.section-head h2{font-weight:800;font-size:clamp(1.6rem,3vw,2.2rem);letter-spacing:-.03em}
.section-head p{color:var(--muted);margin-top:.4rem;font-size:.95rem;max-width:420px;margin-left:auto;margin-right:auto}
.feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem}
.feat-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.3rem;transition:border-color .2s,transform .15s}
.feat-card:hover{border-color:rgba(124,92,255,.15);transform:translateY(-2px)}
.feat-card .fc-icon{width:40px;height:40px;border-radius:10px;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;font-size:1.1rem;margin-bottom:.8rem}
.feat-card h3{font-weight:700;font-size:.95rem;margin-bottom:.25rem}
.feat-card p{color:var(--muted);font-size:.85rem}

/* pricing toggle */
.price-toggle{display:flex;align-items:center;justify-content:center;gap:.6rem;margin-bottom:2rem;font-size:.9rem;color:var(--muted)}
.price-toggle .toggle-track{width:44px;height:24px;background:var(--card);border:1px solid var(--line);border-radius:999px;position:relative;cursor:pointer;transition:background .2s}
.price-toggle .toggle-track.active{background:var(--accent-bg);border-color:rgba(124,92,255,.2)}
.price-toggle .toggle-knob{width:18px;height:18px;background:var(--accent);border-radius:50%;position:absolute;top:2px;left:2px;transition:transform .2s}
.price-toggle .toggle-track.active .toggle-knob{transform:translateX(20px)}
.price-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.price-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.2rem;text-align:center;transition:border-color .2s}
.price-card.featured{border-color:rgba(124,92,255,.2);background:linear-gradient(180deg,rgba(124,92,255,.04),transparent)}
.price-card .plan{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:.5rem}
.price-card .amount{font-weight:800;font-size:1.8rem;letter-spacing:-.04em;color:var(--accent)}
.price-card .amount span{font-size:.85rem;color:var(--muted);font-weight:400}
.price-card .p-desc{font-size:.82rem;color:var(--muted);margin:.3rem 0 .8rem}
.price-card .btn{width:100%;font-size:.85rem;padding:.6rem}

/* brand kit */
.brand-kit{margin:1rem 0 2.5rem;padding:1.25rem;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.brand-kit h2{font-weight:800;font-size:1.25rem;margin-bottom:.85rem}
.brand-row{margin-bottom:1rem}
.brand-row:last-child{margin-bottom:0}
.brand-label{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:.45rem}
.font-lines{display:grid;gap:.35rem;font-size:.95rem}
.font-lines strong{color:var(--accent)}
.swatches{display:flex;flex-wrap:wrap;gap:.75rem}
.swatch{display:flex;align-items:center;gap:.5rem;min-width:140px}
.swatch-sq{width:28px;height:28px;border-radius:7px;border:1px solid rgba(124,92,255,.25);flex-shrink:0}
.swatch-meta{display:flex;flex-direction:column;line-height:1.25}
.swatch-name{font-size:.82rem;font-weight:600}
.swatch-hex{font-size:.75rem;color:var(--muted);font-family:ui-monospace,monospace}
.footer{border-top:1px solid var(--line);padding:1.3rem 0 2rem;color:var(--muted);font-size:.88rem;display:flex;flex-wrap:wrap;justify-content:space-between;gap:.6rem}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .5s ease,transform .5s ease}
.reveal.visible{opacity:1;transform:translateY(0)}

@media(max-width:800px){
  .feat-grid,.price-grid{grid-template-columns:1fr}
  .hero{padding:3rem 0 2rem}
  .hero-metrics{gap:1.2rem}
  .nav-links{display:none}
}
  </style>
