<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forma Store · Ibra Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
:root{--display:'Inter';--body:'Inter';--bg:#f4f4f6;--text:#111;--muted:#6b6b7b;--card:#fff;--line:rgba(0,0,0,.04);--accent:#111;--accent-soft:rgba(0,0,0,.04);--on-accent:#fff;--max:1080px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body),system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
html[dir="rtl"] body{font-family:"IBM Plex Sans Arabic",var(--body),system-ui,sans-serif}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%;height:100%;object-fit:cover}
.wrap{width:min(100% - 2rem,var(--max,1040px));margin:0 auto}
.topbar{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:.55rem 1rem;background:rgba(244,244,246,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.back{font-size:.85rem;font-weight:600;opacity:.8}
.toggles{display:flex;gap:.45rem;align-items:center;flex-wrap:wrap}
.lang,.currency-toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--accent-soft)}
.lang-btn,.currency-toggle button{border:0;background:transparent;color:var(--muted);padding:.32rem .65rem;cursor:pointer;font-weight:700;font-size:.78rem}
.lang-btn.active,.currency-toggle button.active{background:var(--accent);color:#fff}
nav.site{display:flex;justify-content:space-between;align-items:center;padding:1.1rem 0;gap:1rem}
.brand{font-weight:800;font-size:1.3rem;letter-spacing:-.04em}
.nav-links{display:flex;gap:1rem;list-style:none;color:var(--muted);font-size:.9rem;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:.72rem 1.2rem;font-weight:600;font-size:.92rem;border:0;cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn-a{background:var(--accent);color:var(--on-accent)}
.btn-g{background:transparent;border:1px solid var(--line);color:var(--text)}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:2rem;align-items:center;padding:2rem 0}
.hero-visual{min-height:320px;border-radius:20px;overflow:hidden}
.hero-visual img{width:100%;height:320px;object-fit:cover;transition:transform .4s}
.hero-visual:hover img{transform:scale(1.03)}
.hero-text .kicker{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:.3rem}
.hero-text h1{font-weight:800;font-size:clamp(2rem,4.5vw,3rem);line-height:1.05;letter-spacing:-.04em;margin-bottom:.4rem}
.hero-text .lead{color:var(--muted);font-size:.95rem;margin-bottom:1rem}
.hero-cta{display:flex;flex-wrap:wrap;gap:.6rem}

/* sticky filter bar */
.filter-bar{position:sticky;top:52px;z-index:49;background:var(--bg);padding:.6rem 0;border-bottom:1px solid var(--line);display:flex;gap:.45rem;overflow-x:auto;scrollbar-width:none;margin-bottom:1.2rem}
.filter-bar::-webkit-scrollbar{display:none}
.filt{flex-shrink:0;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.4rem .85rem;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;color:var(--muted)}
.filt.active,.filt:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

/* category sliders */
.cat-section{margin-bottom:2rem}
.cat-section .cat-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem}
.cat-section .cat-head h3{font-weight:700;font-size:1rem;letter-spacing:-.02em}
.cat-section .cat-head a{font-size:.8rem;color:var(--muted);font-weight:500}
.cat-scroll{display:flex;gap:.7rem;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:.5rem;scrollbar-width:thin;scrollbar-color:var(--accent-soft) transparent}
.cat-scroll::-webkit-scrollbar{height:3px}
.cat-scroll::-webkit-scrollbar-track{background:transparent}
.cat-scroll::-webkit-scrollbar-thumb{background:var(--accent-soft);border-radius:999px}
.prod-card{scroll-snap-align:start;flex:0 0 220px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:transform .15s}
.prod-card:hover{transform:translateY(-2px)}
.prod-card .pc-img{aspect-ratio:1;overflow:hidden;position:relative}
.prod-card .pc-img img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.prod-card:hover .pc-img img{transform:scale(1.04)}
.prod-card .pc-quick{position:absolute;bottom:.6rem;left:.6rem;right:.6rem;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);border-radius:999px;padding:.35rem;font-size:.75rem;font-weight:600;text-align:center;opacity:0;transform:translateY(8px);transition:all .2s;cursor:pointer}
.prod-card:hover .pc-quick{opacity:1;transform:translateY(0)}
.prod-card .pc-body{padding:.65rem .75rem .75rem}
.prod-card .pc-brand{font-size:.6rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:.1rem}
.prod-card h4{font-weight:600;font-size:.85rem;margin-bottom:.1rem}
.prod-card .price{font-weight:700;font-size:.9rem}

/* product grid */
.prod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem}
.prod-grid .prod-card{flex:auto}
.prod-grid .prod-card .pc-quick{opacity:0;transform:translateY(8px)}
.prod-grid .prod-card:hover .pc-quick{opacity:1;transform:translateY(0)}

/* brand kit */
.brand-kit{margin:1rem 0 2.5rem;padding:1.25rem;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.brand-kit h2{font-weight:800;font-size:1.25rem;margin-bottom:.85rem}
.brand-row{margin-bottom:1rem}
.brand-row:last-child{margin-bottom:0}
.brand-label{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:.45rem}
.font-lines{display:grid;gap:.35rem;font-size:.95rem}
.font-lines strong{color:var(--accent)}
.swatches{display:flex;flex-wrap:wrap;gap:.75rem}
.swatch{display:flex;align-items:center;gap:.5rem;min-width:140px}
.swatch-sq{width:28px;height:28px;border-radius:7px;border:1px solid rgba(128,128,128,.25);flex-shrink:0}
.swatch-meta{display:flex;flex-direction:column;line-height:1.25}
.swatch-name{font-size:.82rem;font-weight:600}
.swatch-hex{font-size:.75rem;color:var(--muted);font-family:ui-monospace,monospace}
.footer{border-top:1px solid var(--line);padding:1.3rem 0 2rem;color:var(--muted);font-size:.88rem;display:flex;flex-wrap:wrap;justify-content:space-between;gap:.6rem}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .5s ease,transform .5s ease}
.reveal.visible{opacity:1;transform:translateY(0)}

@media(max-width:800px){
  .hero{grid-template-columns:1fr;padding:1rem 0}
  .hero-visual{min-height:220px;order:-1}
  .hero-visual img{height:220px}
  .prod-grid{grid-template-columns:1fr 1fr}
  .prod-card{flex:0 0 170px}
  .nav-links{display:none}
}
  </style>
</head>
<body>

        <div class="prod-card"><div class="pc-img"><img src="../../assets/images/shop/card3.jpg" alt="" loading="lazy" /><div class="pc-quick" data-i18n="qa"></div></div><div class="pc-body"><div class="pc-brand" data-i18n="b2"></div><h4 data-i18n="p6t"></h4><span class="price money-price" data-jod="68"></span></div></div>
        <div class="prod-card"><div class="pc-img"><img src="../../assets/images/shop/card1.jpg" alt="" loading="lazy" /><div class="pc-quick" data-i18n="qa"></div></div><div class="pc-body"><div class="pc-brand" data-i18n="b2"></div><h4 data-i18n="p7t"></h4><span class="price money-price" data-jod="42"></span></div></div>

  <script src="../shared/lang.js"></script>
  <script src="../../js/currency.js"></script>
  <script>
    var DICT = {"en": {"back": "← Ibra Studio", "nav1": "Shop", "nav2": "Sale", "nav3": "About", "nav4": "Cart", "kicker": "Design store", "h1": "Clean<span>minimal.</span>", "lead": "Curated home goods - furniture, lighting, decor, and everyday essentials.", "cta1": "Shop now", "cta2": "Sale", "fa": "All", "fc": "Chairs", "ff": "Furniture", "fh": "Home", "fa2": "Lighting", "fe": "Decor", "cs1": "New arrivals", "cs2": "Best sellers", "va": "View all", "qa": "Quick add", "b1": "Forma", "b2": "Forma+", "p1t": "Minimal Desk Lamp", "p2t": "Bamboo Shelf", "p3t": "Wool Throw Blanket", "p4t": "Ceramic Vase Set", "p5t": "Oak Coffee Table", "p6t": "Leather Armchair", "p7t": "Brass Wall Mirror", "p8t": "Floor Lamp Arc", "suffix": " JOD", "brand_title": "Brand kit", "fonts_label": "Fonts", "colors_label": "Colors", "font_roles": "All text", "foot": "Forma Store · Ibra Studio template"}, "ar": {"back": "← Ibra Studio", "nav1": "تسوق", "nav2": "تخفيضات", "nav3": "عن", "nav4": "السلة", "kicker": "متجر تصميم", "h1": "نظيف<span>وبسيط.</span>", "lead": "مستلزمات منزلية منتقاة - أثاث وإضاءة وديكور.", "cta1": "تسوق الآن", "cta2": "التخفيضات", "fa": "الكل", "fc": "كراسي", "ff": "أثاث", "fh": "منزل", "fa2": "إضاءة", "fe": "ديكور", "cs1": "وصل حديثاً", "cs2": "الأكثر مبيعاً", "va": "عرض الكل", "qa": "أضف سريعاً", "b1": "فورما", "b2": "فورما+", "p1t": "مصباح طاولة بسيط", "p2t": "رف خيزران", "p3t": "بطانية صوف", "p4t": "طقم مزهرية سيراميك", "p5t": "طاولة قهوة بلوط", "p6t": "كرسي جلدي", "p7t": "مرآة حائط نحاسية", "p8t": "أباجورة أرضية", "suffix": " دينار", "brand_title": "هوية العلامة", "fonts_label": "الخطوط", "colors_label": "الألوان", "font_roles": "جميع النصوص", "foot": "فورما · قالب Ibra Studio"}};
    var COLORS = [{"hex": "#f4f4f6", "en": "Light gray", "ar": "رمادي فاتح"}, {"hex": "#111", "en": "Black", "ar": "أسود"}, {"hex": "#6b6b7b", "en": "Steel gray", "ar": "رمادي فولاذي"}, {"hex": "#fff", "en": "White", "ar": "أبيض"}];

    function observeReveal() {document.querySelectorAll(".reveal").forEach(function(el){var o=new IntersectionObserver(function(e){e.forEach(function(e){if(e.isIntersecting){el.classList.add("visible");o.unobserve(el)}})},{threshold:.1});o.observe(el)})}
    function paintColorNames(lang){document.querySelectorAll("[data-color-en]").forEach(function(el){el.textContent=lang==="ar"?el.getAttribute("data-color-ar"):el.getAttribute("data-color-en")})}
    function applySuffix(){var lang=document.documentElement.lang==="ar"?"ar":"en";var suf=(DICT[lang]&&DICT[lang].suffix)||"";document.querySelectorAll(".money-price").forEach(function(el){el.setAttribute("data-suffix",suf)});if(window.IbraMoney)IbraMoney.applyAll()}
    var _init=IbraLang.init;IbraLang.init=function(dict){_init(dict);paintColorNames(document.documentElement.lang==="ar"?"ar":"en");applySuffix();document.querySelectorAll(".lang-btn").forEach(function(btn){btn.addEventListener("click",function(){setTimeout(function(){paintColorNames(btn.getAttribute("data-lang"));applySuffix()},0)})})};IbraLang.init(DICT);document.addEventListener("ibra-currency",applySuffix);observeReveal();
