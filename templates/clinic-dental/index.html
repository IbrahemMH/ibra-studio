<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrightSmile Dental · Ibra Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
:root{--display:'Manrope';--body:'Inter';--bg:#f0f9fe;--text:#0b2636;--muted:#4f7a94;--card:#ffffff;--line:rgba(11,38,54,.06);--accent:#0ea5e9;--accent-light:#e0f2fe;--on-accent:#fff;--max:1080px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body),system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh}
html[dir="rtl"] body{font-family:"IBM Plex Sans Arabic",var(--body),system-ui,sans-serif}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%;height:100%;object-fit:cover}
.wrap{width:min(100% - 2rem,var(--max,1040px));margin:0 auto}
.topbar{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:.55rem 1rem;background:rgba(240,249,254,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.back{font-size:.85rem;font-weight:600;opacity:.8}
.toggles{display:flex;gap:.45rem;align-items:center;flex-wrap:wrap}
.lang,.currency-toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:rgba(14,165,233,.06)}
.lang-btn,.currency-toggle button{border:0;background:transparent;color:var(--muted);padding:.32rem .65rem;cursor:pointer;font-weight:700;font-size:.78rem}
.lang-btn.active,.currency-toggle button.active{background:var(--accent);color:#fff}
nav.site{display:flex;justify-content:space-between;align-items:center;padding:1.1rem 0;gap:1rem}
.brand{font-family:var(--display);font-weight:800;font-size:1.3rem;letter-spacing:-.03em;color:var(--accent)}
.nav-links{display:flex;gap:1rem;list-style:none;color:var(--muted);font-size:.9rem;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:.72rem 1.2rem;font-weight:700;font-size:.92rem;border:0;cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn-a{background:var(--accent);color:var(--on-accent)}
.btn-g{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn-g:hover{background:rgba(14,165,233,.04)}

/* hero with circular cutout */
.hero{display:grid;grid-template-columns:.95fr 1.05fr;gap:2rem;align-items:center;padding:2rem 0 1rem;min-height:440px}
.hero-visual{position:relative;display:grid;place-items:center;min-height:360px}
.hero-circle{width:min(42vw,360px);height:min(42vw,360px);border-radius:50%;overflow:hidden;border:6px solid var(--accent-light);box-shadow:0 20px 50px rgba(14,165,233,.08);position:relative}
.hero-circle img{width:100%;height:100%;object-fit:cover}
.hero-circle::after{content:'';position:absolute;inset:0;border-radius:50%;background:linear-gradient(135deg,rgba(14,165,233,.06),transparent 50%)}
.hero-text .kicker{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:.5rem}
.hero-text h1{font-family:var(--display);font-size:clamp(2rem,4.5vw,3rem);line-height:1.08;letter-spacing:-.04em;font-weight:800;margin-bottom:.5rem}
.hero-text h1 span{color:var(--accent)}
.hero-text .lead{color:var(--muted);font-size:.95rem;margin-bottom:1.2rem;max-width:28rem}
.hero-cta{display:flex;flex-wrap:wrap;gap:.6rem}

/* dental arch cards */
.section{padding:2rem 0 2.5rem}
.section-head{text-align:center;margin-bottom:1.5rem}
.section-head h2{font-family:var(--display);font-size:clamp(1.4rem,2.5vw,1.8rem);font-weight:800;letter-spacing:-.03em}
.section-head p{color:var(--muted);margin-top:.3rem;font-size:.9rem}

.arch-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;position:relative}
.arch-grid::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:70%;height:2px;background:radial-gradient(ellipse,var(--accent-light),transparent 70%);pointer-events:none;opacity:.6}
.arch-card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;transition:transform .25s,box-shadow .25s;position:relative;z-index:2}
.arch-card:nth-child(1){transform:translateY(-8px)}
.arch-card:nth-child(3){transform:translateY(-8px)}
.arch-card:hover{transform:translateY(-12px);box-shadow:0 16px 40px rgba(14,165,233,.08)}
.arch-card .card-img{aspect-ratio:16/10;overflow:hidden}
.arch-card .card-img img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.arch-card:hover .card-img img{transform:scale(1.05)}
.arch-card .card-body{padding:.9rem 1rem 1rem;text-align:center}
.arch-card .icon-tooth{font-size:1.5rem;margin-bottom:.3rem}
.arch-card h3{font-family:var(--display);font-size:1rem;font-weight:700;margin-bottom:.2rem}
.arch-card p{color:var(--muted);font-size:.85rem}
.price{font-weight:800;display:block;margin-top:.5rem;color:var(--accent);font-size:1rem}

/* brand kit */
.brand-kit{margin:1rem 0 2.5rem;padding:1.25rem;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.brand-kit h2{font-family:var(--display);font-size:1.25rem;margin-bottom:.85rem;font-weight:800}
.brand-row{margin-bottom:1rem}
.brand-row:last-child{margin-bottom:0}
.brand-label{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:.45rem}
.font-lines{display:grid;gap:.35rem;font-size:.95rem}
.font-lines strong{color:var(--accent)}
.swatches{display:flex;flex-wrap:wrap;gap:.75rem}
.swatch{display:flex;align-items:center;gap:.5rem;min-width:140px}
.swatch-sq{width:28px;height:28px;border-radius:7px;border:1px solid rgba(128,128,128,.25);flex-shrink:0}
.swatch-meta{display:flex;flex-direction:column;line-height:1.25}
.swatch-name{font-size:.82rem;font-weight:600}
.swatch-hex{font-size:.75rem;color:var(--muted);font-family:ui-monospace,monospace}
.footer{border-top:1px solid var(--line);padding:1.3rem 0 2rem;color:var(--muted);font-size:.88rem;display:flex;flex-wrap:wrap;justify-content:space-between;gap:.6rem}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .5s ease,transform .5s ease}
.reveal.visible{opacity:1;transform:translateY(0)}

@media(max-width:800px){
  .hero{grid-template-columns:1fr;min-height:auto;padding:1rem 0}
  .hero-circle{width:200px;height:200px}
  .hero-visual{order:-1;min-height:200px}
  .arch-grid::before{display:none}
  .arch-card:nth-child(1),.arch-card:nth-child(3){transform:none}
  .arch-card:hover{transform:translateY(-6px)}
  .arch-grid{grid-template-columns:1fr}
  .nav-links{display:none}
}
  </style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="../../index.html" data-i18n="back">← Ibra Studio</a>
    <div class="toggles">
      <div class="lang" aria-label="Language">
        <button type="button" class="lang-btn active" data-lang="en">EN</button>
        <button type="button" class="lang-btn" data-lang="ar">ع</button>
      </div>
      <div class="currency-toggle" aria-label="Currency">
        <button type="button" data-currency="JOD" class="active">JOD</button>
        <button type="button" data-currency="USD">USD</button>
      </div>
    </div>
  </div>
  <div class="wrap">
    <nav class="site">
      <div class="brand">BrightSmile</div>
      <ul class="nav-links">
        <li data-i18n="nav1"></li>
        <li data-i18n="nav2"></li>
        <li data-i18n="nav3"></li>
      </ul>
      <a class="btn btn-a" href="#" data-i18n="nav4"></a>
    </nav>
  </div>

  <div class="wrap">
    <section class="hero">
      <div class="hero-visual">
        <div class="hero-circle"><img src="../../assets/images/dental/hero.jpg" alt="BrightSmile Dental" /></div>
      </div>
      <div class="hero-text">
        <div class="kicker" data-i18n="kicker"></div>
        <h1 data-i18n-html="h1"></h1>
        <p class="lead" data-i18n="lead"></p>
        <div class="hero-cta">
          <a class="btn btn-a" href="#" data-i18n="cta1"></a>
          <a class="btn btn-g" href="#" data-i18n="cta2"></a>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2 data-i18n="s_title"></h2>
        <p data-i18n="s_sub"></p>
      </div>
      <div class="arch-grid">
        <article class="arch-card reveal">
          <div class="card-img"><img src="../../assets/images/dental/card1.jpg" alt="" loading="lazy" /></div>
          <div class="card-body"><div class="icon-tooth">🦷</div><h3 data-i18n="c1t"></h3><p data-i18n="c1p"></p><span class="price money-price" data-jod="35"></span></div>
        </article>
        <article class="arch-card reveal">
          <div class="card-img"><img src="../../assets/images/dental/card2.jpg" alt="" loading="lazy" /></div>
          <div class="card-body"><div class="icon-tooth">🦷</div><h3 data-i18n="c2t"></h3><p data-i18n="c2p"></p><span class="price money-price" data-jod="55"></span></div>
        </article>
        <article class="arch-card reveal">
          <div class="card-img"><img src="../../assets/images/dental/card3.jpg" alt="" loading="lazy" /></div>
          <div class="card-body"><div class="icon-tooth">🦷</div><h3 data-i18n="c3t"></h3><p data-i18n="c3p"></p><span class="price money-price" data-jod="120"></span></div>
        </article>
      </div>
    </section>

    <section class="brand-kit" id="brand-kit">
      <h2><span data-i18n="brand_title">Brand kit</span> · BrightSmile Dental</h2>
      <div class="brand-row">
        <div class="brand-label" data-i18n="fonts_label">Fonts</div>
        <div class="font-lines">
          <div><strong>Manrope</strong> - <span data-i18n="font_roles">Headings</span></div>
          <div><strong>Inter</strong> - body</div>
        </div>
      </div>
      <div class="brand-row">
        <div class="brand-label" data-i18n="colors_label">Colors</div>
        <div class="swatches">
        <div class="swatch"><span class="swatch-sq" style="background:#f0f9fe" title="#f0f9fe"></span><span class="swatch-meta"><span class="swatch-name" data-color-en="Bright white" data-color-ar="أبيض ساطع">Bright white</span><span class="swatch-hex">#f0f9fe</span></span></div>
        <div class="swatch"><span class="swatch-sq" style="background:#0ea5e9" title="#0ea5e9"></span><span class="swatch-meta"><span class="swatch-name" data-color-en="Sky blue" data-color-ar="أزرق سماوي">Sky blue</span><span class="swatch-hex">#0ea5e9</span></span></div>
        <div class="swatch"><span class="swatch-sq" style="background:#e0f2fe" title="#e0f2fe"></span><span class="swatch-meta"><span class="swatch-name" data-color-en="Soft sky" data-color-ar="سماوي ناعم">Soft sky</span><span class="swatch-hex">#e0f2fe</span></span></div>
        <div class="swatch"><span class="swatch-sq" style="background:#4f7a94" title="#4f7a94"></span><span class="swatch-meta"><span class="swatch-name" data-color-en="Steel blue" data-color-ar="أزرق فولاذي">Steel blue</span><span class="swatch-hex">#4f7a94</span></span></div>
        <div class="swatch"><span class="swatch-sq" style="background:#ffffff" title="#ffffff"></span><span class="swatch-meta"><span class="swatch-name" data-color-en="White" data-color-ar="أبيض">White</span><span class="swatch-hex">#ffffff</span></span></div>
        </div>
      </div>
    </section>
    <footer class="footer">
      <span data-i18n="foot"></span>
      <span>EN · AR · JOD · USD</span>
    </footer>
  </div>
  <script src="../shared/lang.js"></script>
  <script src="../../js/currency.js"></script>
  <script>
    var DICT = {"en": {"back": "← Ibra Studio", "nav1": "Services", "nav2": "Before/After", "nav3": "Contact", "nav4": "Book now", "kicker": "Dental care · Amman", "h1": "Your smile,<span>our specialty.</span>", "lead": "Gentle, modern dentistry for the whole family - from whitening to implants.", "cta1": "Free consultation", "cta2": "View services", "s_title": "Our treatments", "s_sub": "Everything for a healthy, confident smile.", "c1t": "Teeth Whitening", "c1p": "Professional laser whitening - 3 shades brighter in one session.", "c2t": "Invisalign", "c2p": "Clear aligners for straight teeth without metal braces.", "c3t": "Dental Implants", "c3p": "Permanent titanium implants with natural-looking crowns.", "suffix": "", "brand_title": "Brand kit", "fonts_label": "Fonts", "colors_label": "Colors", "font_roles": "Headings", "foot": "BrightSmile Dental · Ibra Studio template"}, "ar": {"back": "← Ibra Studio", "nav1": "الخدمات", "nav2": "قبل/بعد", "nav3": "اتصل", "nav4": "احجز الآن", "kicker": "عناية أسنان · عمّان", "h1": "ابتسامتك،<span>اختصاصنا.</span>", "lead": "طب أسنان لطيف وحديث للعائلة - من التبييض إلى الزراعة.", "cta1": "استشارة مجانية", "cta2": "عرض الخدمات", "s_title": "علاجاتنا", "s_sub": "كل ما تحتاجه لابتسامة صحية وواثقة.", "c1t": "تبييض الأسنان", "c1p": "تبييض ليزري احترافي - 3 درجات أفتح في جلسة.", "c2t": "إنفيزالاين", "c2p": "تقويم شفاف لأسنان مستقيمة بدون تقويم معدني.", "c3t": "زراعة الأسنان", "c3p": "غرسات تيتانيوم دائمة مع تيجان طبيعية المظهر.", "suffix": "", "brand_title": "هوية العلامة", "fonts_label": "الخطوط", "colors_label": "الألوان", "font_roles": "العناوين", "foot": "ابتسامة مشرقة · قالب Ibra Studio"}};
    var COLORS = [{"hex": "#f0f9fe", "en": "Bright white", "ar": "أبيض ساطع"}, {"hex": "#0ea5e9", "en": "Sky blue", "ar": "أزرق سماوي"}, {"hex": "#e0f2fe", "en": "Soft sky", "ar": "سماوي ناعم"}, {"hex": "#4f7a94", "en": "Steel blue", "ar": "أزرق فولاذي"}, {"hex": "#ffffff", "en": "White", "ar": "أبيض"}];

    function observeReveal() {
      document.querySelectorAll(".reveal").forEach(function (el) {
        var obs = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (e.isIntersecting) { el.classList.add("visible"); obs.unobserve(el); }
          });
        }, {threshold: 0.1});
        obs.observe(el);
      });
    }
    function paintColorNames(lang) {
      document.querySelectorAll("[data-color-en]").forEach(function (el) {
        el.textContent = lang === "ar" ? el.getAttribute("data-color-ar") : el.getAttribute("data-color-en");
      });
    }
    function applySuffix() {
      var lang = document.documentElement.lang === "ar" ? "ar" : "en";
      var suf = (DICT[lang] && DICT[lang].suffix) || "";
      document.querySelectorAll(".money-price").forEach(function (el) {
        el.setAttribute("data-suffix", suf);
      });
      if (window.IbraMoney) IbraMoney.applyAll();
    }
    var _init = IbraLang.init;
    IbraLang.init = function (dict) {
      _init(dict);
      paintColorNames(document.documentElement.lang === "ar" ? "ar" : "en");
      applySuffix();
      document.querySelectorAll(".lang-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          setTimeout(function () {
            paintColorNames(btn.getAttribute("data-lang"));
            applySuffix();
          }, 0);
        });
      });
    };
    IbraLang.init(DICT);
    document.addEventListener("ibra-currency", applySuffix);
    observeReveal();
  </script>
</body>
</html>
