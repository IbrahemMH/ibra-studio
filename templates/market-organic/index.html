<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GreenLeaf Organic · Ibra Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
:root{--display:'DM Serif Display';--body:'Inter';--bg:#f5f2ec;--text:#1e2a1e;--muted:#6a7f6a;--card:#ffffff;--line:rgba(30,42,30,.08);--accent:#4d7c0f;--accent-light:#d9f99d;--accent-warm:#e7d5b5;--on-accent:#fff;--max:1080px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body),system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
html[dir="rtl"] body{font-family:"IBM Plex Sans Arabic",var(--body),system-ui,sans-serif}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%;height:100%;object-fit:cover}
.wrap{width:min(100% - 2rem,var(--max,1040px));margin:0 auto}

/* topbar */
.topbar{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:.55rem 1rem;background:rgba(245,242,236,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.back{font-size:.85rem;font-weight:600;opacity:.8}
.toggles{display:flex;gap:.45rem;align-items:center;flex-wrap:wrap}
.lang,.currency-toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:rgba(77,124,15,.06)}
.lang-btn,.currency-toggle button{border:0;background:transparent;color:var(--muted);padding:.32rem .65rem;cursor:pointer;font-weight:700;font-size:.78rem}
.lang-btn.active,.currency-toggle button.active{background:var(--accent-light);color:var(--accent)}
nav.site{display:flex;justify-content:space-between;align-items:center;padding:1.1rem 0;gap:1rem}
.brand{font-family:var(--display);font-style:italic;font-weight:400;font-size:1.3rem;color:var(--accent)}
.nav-links{display:flex;gap:1rem;list-style:none;color:var(--muted);font-size:.9rem;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:.72rem 1.2rem;font-weight:600;font-size:.92rem;border:0;cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn-a{background:var(--accent);color:var(--on-accent)}
.btn-g{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn-g:hover{background:rgba(77,124,15,.04)}

/* hero - leaf clip mask */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:2rem;align-items:center;padding:2rem 0 1rem}
.hero-visual{min-height:380px;position:relative}
.hero-img-clip{position:absolute;inset:0;clip-path:url(#leafClip);overflow:hidden}
.hero-img-clip img{width:100%;height:100%;object-fit:cover}
.hero-img-clip::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(77,124,15,.1),transparent 50%)}
.hero-text .kicker{font-family:var(--display);font-style:italic;font-size:.85rem;color:var(--accent);margin-bottom:.4rem}
.hero-text h1{font-family:var(--display);font-size:clamp(2rem,4.5vw,3rem);line-height:1.08;letter-spacing:-.02em;margin-bottom:.6rem;font-weight:400}
.hero-text .lead{color:var(--muted);font-size:.95rem;margin-bottom:1.2rem}
.hero-cta{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:1.2rem}
.hero-meta{display:flex;gap:1.5rem;flex-wrap:wrap;color:var(--muted);font-size:.85rem}
.hero-meta strong{display:block;font-family:var(--display);color:var(--accent);font-size:1.2rem;font-style:italic}

/* crate cards */
.section{padding:1.8rem 0 2.5rem}
.section-head{margin-bottom:1.5rem}
.section-head h2{font-family:var(--display);font-size:clamp(1.4rem,2.5vw,1.8rem);font-weight:400;letter-spacing:-.02em}
.section-head p{color:var(--muted);margin-top:.3rem;font-size:.9rem}

.crate-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.crate-card{background:var(--card);border:2px solid var(--accent-warm);border-top-width:6px;border-radius:6px;overflow:hidden;transition:transform .2s,border-color .2s;position:relative}
.crate-card:hover{transform:translateY(-4px);border-color:var(--accent)}
.crate-card .card-img{aspect-ratio:16/10;overflow:hidden}
.crate-card .card-img img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.crate-card:hover .card-img img{transform:scale(1.04)}
.crate-card .card-body{padding:.85rem 1rem 1rem;display:flex;flex-direction:column}
.crate-card .origin{font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:.2rem}
.crate-card h3{font-family:var(--display);font-size:1.05rem;font-weight:400;margin-bottom:.2rem}
.crate-card p{color:var(--muted);font-size:.85rem;flex:1}
.price{font-family:var(--display);font-style:italic;display:block;margin-top:.5rem;color:var(--accent);font-size:1rem}

/* farm story masonry */
.farm-story{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin:1.5rem 0}
.farm-item{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:1.1rem;display:flex;gap:.8rem;align-items:flex-start}
.farm-item .fi-icon{font-size:1.4rem;flex-shrink:0;margin-top:.15rem}
.farm-item h4{font-family:var(--display);font-size:.95rem;font-weight:400;margin-bottom:.15rem}
.farm-item p{color:var(--muted);font-size:.82rem}

/* brand kit */
.brand-kit{margin:1rem 0 2.5rem;padding:1.25rem;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.brand-kit h2{font-family:var(--display);font-size:1.25rem;margin-bottom:.85rem;font-weight:400}
.brand-row{margin-bottom:1rem}
.brand-row:last-child{margin-bottom:0}
.brand-label{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:.45rem}
.font-lines{display:grid;gap:.35rem;font-size:.95rem}
.font-lines strong{color:var(--accent)}
.swatches{display:flex;flex-wrap:wrap;gap:.75rem}
.swatch{display:flex;align-items:center;gap:.5rem;min-width:140px}
.swatch-sq{width:28px;height:28px;border-radius:7px;border:1px solid rgba(128,128,128,.25);flex-shrink:0}
.swatch-meta{display:flex;flex-direction:column;line-height:1.25}
.swatch-name{font-size:.82rem;font-weight:600}
.swatch-hex{font-size:.75rem;color:var(--muted);font-family:ui-monospace,monospace}
.footer{border-top:1px solid var(--line);padding:1.3rem 0 2rem;color:var(--muted);font-size:.88rem;display:flex;flex-wrap:wrap;justify-content:space-between;gap:.6rem}

.reveal{opacity:0;transform:translateY(20px);transition:opacity .5s ease,transform .5s ease}
.reveal.visible{opacity:1;transform:translateY(0)}

@media(max-width:800px){
  .hero{grid-template-columns:1fr;padding:1rem 0}
  .hero-visual{min-height:260px;order:-1}
  .hero-img-clip{clip-path:none;border-radius:16px}
  .crate-grid{grid-template-columns:1fr}
  .farm-story{grid-template-columns:1fr}
  .nav-links{display:none}
}
  </style>
</head>
<body>
  <svg style="position:absolute;width:0;height:0"><defs><clipPath id="leafClip" clipPathUnits="objectBoundingBox"><path d="M0.08,0.12 C0.18,0.04 0.38,0 0.5,0.04 C0.62,0 0.82,0.04 0.92,0.12 C0.98,0.22 1,0.38 0.96,0.5 C1,0.62 0.98,0.78 0.92,0.88 C0.82,0.96 0.62,1 0.5,0.96 C0.38,1 0.18,0.96 0.08,0.88 C0.02,0.78 0,0.62 0.04,0.5 C0,0.38 0.02,0.22 0.08,0.12Z"/></clipPath></defs></svg>
  <div class="topbar">
    <a class="back" href="../../index.html" data-i18n="back">← Ibra Studio</a>
    <div class="toggles">
      <div class="lang" aria-label="Language">

  <div class="wrap">

          <div class="card-body"><div class="origin" data-i18n="o2"></div><h3 data-i18n="c2t"></h3><p data-i18n="c2p"></p><span class="price money-price" data-jod="16"></span></div>

          <div class="card-img"><img src="../../assets/images/organic/card3.jpg" alt="" loading="lazy" /></div>
          <div class="card-body"><div class="origin" data-i18n="o3"></div><h3 data-i18n="c3t"></h3><p data-i18n="c3p"></p><span class="price money-price" data-jod="32"></span></div>

    <!-- farm story -->
    <div class="farm-story reveal">
      <div class="farm-item"><span class="fi-icon">🌱</span><div><h4 data-i18n="f1t"></h4><p data-i18n="f1p"></p></div></div>

      <div class="farm-item"><span class="fi-icon">🚜</span><div><h4 data-i18n="f3t"></h4><p data-i18n="f3p"></p></div></div>
      <div class="farm-item"><span class="fi-icon">🌍</span><div><h4 data-i18n="f4t"></h4><p data-i18n="f4p"></p></div></div>

    <section class="brand-kit" id="brand-kit">
      <h2><span data-i18n="brand_title">Brand kit</span> · GreenLeaf Organic</h2>
      <div class="brand-row">
        <div class="brand-label" data-i18n="fonts_label">Fonts</div>
        <div class="font-lines">
          <div><strong>DM Serif Display</strong> - <span data-i18n="font_roles">Headings</span></div>
          <div><strong>Inter</strong> - body</div>
        </div>
      </div>
      <div class="brand-row">
        <div class="brand-label" data-i18n="colors_label">Colors</div>
        <div class="swatches">
        <div class="swatch"><span class="swatch-sq" style="background:#f5f2ec" title="#f5f2ec"></span><span class="swatch-meta"><span class="swatch-name" data-color-en="Flax linen" data-color-ar="كتان طبيعي">Flax linen</span><span class="swatch-hex">#f5f2ec</span></span></div>
        <div class="swatch"><span class="swatch-sq" style="background:#4d7c0f" title="#4d7c0f"></span><span class="swatch-meta"><span class="swatch-name" data-color-en="Forest leaf" data-color-ar="ورقة غابية">Forest leaf</span><span class="swatch-hex">#4d7c0f</span></span></div>
        <div class="swatch"><span class="swatch-sq" style="background:#d9f99d" title="#d9f99d"></span><span class="swatch-meta"><span class="swatch-name" data-color-en="Spring mist" data-color-ar="ضباب ربيعي">Spring mist</span><span class="swatch-hex">#d9f99d</span></span></div>
        <div class="swatch"><span class="swatch-sq" style="background:#6a7f6a" title="#6a7f6a"></span><span class="swatch-meta"><span class="swatch-name" data-color-en="Moss gray" data-color-ar="رمادي طحلبي">Moss gray</span><span class="swatch-hex">#6a7f6a</span></span></div>
        <div class="swatch"><span class="swatch-sq" style="background:#ffffff" title="#ffffff"></span><span class="swatch-meta"><span class="swatch-name" data-color-en="White" data-color-ar="أبيض">White</span><span class="swatch-hex">#ffffff</span></span></div>

    <footer class="footer">
      <span data-i18n="foot"></span>
      <span>EN · AR · JOD · USD</span>
    </footer>
  </div>
  <script src="../shared/lang.js"></script>
  <script src="../../js/currency.js"></script>
  <script>
    var DICT = {"en": {"back": "← Ibra Studio", "nav1": "Shop", "nav2": "Our Story", "nav3": "Delivery", "nav4": "Subscribe", "kicker": "From our farm to your table", "h1": "Naturally <span>grown.</span>", "lead": "Certified organic produce, pasture-raised eggs, and handcrafted pantry goods - straight from local farms.", "cta1": "Explore produce", "cta2": "Learn more", "m1v": "100%", "m1l": " Organic certified", "m2v": "24h", "m2l": " Farm to table", "s_title": "This week's harvest", "s_sub": "Picked at peak ripeness and delivered fresh.", "o1": "From Al Salt valley", "o2": "From Jordan Valley", "o3": "Handmade in Amman", "c1t": "Seasonal Fruit Box", "c1p": "Organic apples, oranges, bananas, and seasonal berries.", "c2t": "Heirloom Tomato Pack", "c2p": "Vine-ripened heirloom tomatoes, perfect for salads and sauces.", "c3t": "Artisan Pantry Set", "c3p": "Cold-pressed olive oil, wild honey, zaatar, and sun-dried figs.", "f1t": "Regenerative farming", "f1p": "We restore soil health through crop rotation and composting.", "f2t": "Grown by families", "f2p": "Partnering with 12 local family farms across Jordan.", "f3t": "Harvest to doorstep", "f3p": "Picked in the morning, delivered to you by evening.", "f4t": "Plastic-free", "f4p": "Every order packed in compostable and recycled materials.", "suffix": "", "brand_title": "Brand kit", "fonts_label": "Fonts", "colors_label": "Colors", "font_roles": "Headings", "foot": "GreenLeaf Organic · Ibra Studio template"}, "ar": {"back": "← Ibra Studio", "nav1": "تسوق", "nav2": "قصتنا", "nav3": "التوصيل", "nav4": "اشتراك", "kicker": "من مزرعتنا إلى مائدتك", "h1": "مزروع <span>طبيعياً.</span>", "lead": "منتجات عضوية معتمدة وبيض طليق وحرفيات مخزن - مباشرة من المزارع المحلية.", "cta1": "تصفح المنتجات", "cta2": "اعرف المزيد", "m1v": "١٠٠٪", "m1l": " عضوي معتمد", "m2v": "٢٤", "m2l": " ساعة من المزرعة", "s_title": "حصاد هذا الأسبوع", "s_sub": "قطف في ذروة النضج وتوصيل طازج.", "o1": "من وادي السلط", "o2": "من غور الأردن", "o3": "حرفي من عمّان", "c1t": "صندوق الفواكه الموسمية", "c1p": "تفاح وبرتقال وموز وتوت موسمي عضوي.", "c2t": "حزمة الطماطم التراثية", "c2p": "طماطم تراثية منقوعة في الكرمة، مثالية للسلطات.", "c3t": "طقم المخزن الحرفي", "c3p": "زيت زيتون بكر وعسل بري وزعتر وتين مجفف.", "f1t": "زراعة متجددة", "f1p": "نستعيد صحة التربة من خلال تدوير المحاصيل.", "f2t": "تزرعها العائلات", "f2p": "شراكة مع 12 مزرعة عائلية محلية في الأردن.", "f3t": "من الحصاد إلى الباب", "f3p": "يقطف صباحاً ويوصلك في المساء.", "f4t": "خالٍ من البلاستيك", "f4p": "كل طلب يُعبأ بمواد قابلة للتحلل.", "suffix": "", "brand_title": "هوية العلامة", "fonts_label": "الخطوط", "colors_label": "الألوان", "font_roles": "العناوين", "foot": "جرين ليف · قالب Ibra Studio"}};
    var COLORS = [{"hex": "#f5f2ec", "en": "Flax linen", "ar": "كتان طبيعي"}, {"hex": "#4d7c0f", "en": "Forest leaf", "ar": "ورقة غابية"}, {"hex": "#d9f99d", "en": "Spring mist", "ar": "ضباب ربيعي"}, {"hex": "#6a7f6a", "en": "Moss gray", "ar": "رمادي طحلبي"}, {"hex": "#ffffff", "en": "White", "ar": "أبيض"}];

    function observeReveal() {
      document.querySelectorAll(".reveal").forEach(function (el) {
        var obs = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (e.isIntersecting) { el.classList.add("visible"); obs.unobserve(el); }
          });
        }, {threshold: 0.1});
        obs.observe(el);
      });
    }
    function paintColorNames(lang) {
      document.querySelectorAll("[data-color-en]").forEach(function (el) {
        el.textContent = lang === "ar" ? el.getAttribute("data-color-ar") : el.getAttribute("data-color-en");
      });
    }
    function applySuffix() {
      var lang = document.documentElement.lang === "ar" ? "ar" : "en";
      var suf = (DICT[lang] && DICT[lang].suffix) || "";
      document.querySelectorAll(".money-price").forEach(function (el) {
        el.setAttribute("data-suffix", suf);
      });
      if (window.IbraMoney) IbraMoney.applyAll();
    }
    var _init = IbraLang.init;
    IbraLang.init = function (dict) {
      _init(dict);
      paintColorNames(document.documentElement.lang === "ar" ? "ar" : "en");
      applySuffix();
      document.querySelectorAll(".lang-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          setTimeout(function () {
            paintColorNames(btn.getAttribute("data-lang"));
            applySuffix();
          }, 0);
        });
      });
    };
    IbraLang.init(DICT);
    document.addEventListener("ibra-currency", applySuffix);
    observeReveal();
  </script>
