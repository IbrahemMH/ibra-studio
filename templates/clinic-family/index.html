<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Health Hub · Ibra Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Figtree:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
:root{--display:'Figtree';--body:'Inter';--bg:#fef7f0;--text:#2b1d13;--muted:#8b6f5a;--card:#ffffff;--line:rgba(43,29,19,.06);--accent:#ea580c;--accent-light:#fed7aa;--on-accent:#fff;--max:1080px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body),system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh;overflow-x:hidden}
html[dir="rtl"] body{font-family:"IBM Plex Sans Arabic",var(--body),system-ui,sans-serif}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%;height:100%;object-fit:cover}
.wrap{width:min(100% - 2rem,var(--max,1040px));margin:0 auto}
.topbar{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:.55rem 1rem;background:rgba(254,247,240,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.back{font-size:.85rem;font-weight:600;opacity:.8}
.toggles{display:flex;gap:.45rem;align-items:center;flex-wrap:wrap}
.lang,.currency-toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:rgba(234,88,12,.06)}
.lang-btn,.currency-toggle button{border:0;background:transparent;color:var(--muted);padding:.32rem .65rem;cursor:pointer;font-weight:700;font-size:.78rem}
.lang-btn.active,.currency-toggle button.active{background:var(--accent);color:#fff}
nav.site{display:flex;justify-content:space-between;align-items:center;padding:1.1rem 0;gap:1rem}
.brand{font-family:var(--display);font-weight:800;font-size:1.3rem;letter-spacing:-.02em;color:var(--accent)}
.nav-links{display:flex;gap:1rem;list-style:none;color:var(--muted);font-size:.9rem;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:.72rem 1.2rem;font-weight:700;font-size:.92rem;border:0;cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn-a{background:var(--accent);color:var(--on-accent)}
.btn-g{background:transparent;border:1px solid var(--line);color:var(--text)}

/* hero with polaroid */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:center;padding:2rem 0}
.polaroid{background:var(--card);padding:.6rem .6rem 1.6rem;box-shadow:0 8px 30px rgba(234,88,12,.06);transform:rotate(-2deg);transition:transform .2s}
.polaroid:nth-child(2){transform:rotate(3deg);margin-top:-2rem}
.polaroid:hover{transform:rotate(0deg) scale(1.02)}
.polaroid img{aspect-ratio:1;object-fit:cover;width:100%;margin-bottom:.5rem}
.polaroid .caption{font-size:.75rem;text-align:center;color:var(--muted);font-style:italic}
.polaroid-stack{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.hero-text .kicker{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:.5rem}
.hero-text h1{font-family:var(--display);font-size:clamp(2rem,4.5vw,3rem);line-height:1.08;letter-spacing:-.03em;font-weight:800;margin-bottom:.5rem}
.hero-text .lead{color:var(--muted);font-size:.95rem;margin-bottom:1.2rem}
.hero-cta{display:flex;flex-wrap:wrap;gap:.6rem}

/* timeline */
.section{padding:2rem 0 2.5rem}
.section-head{margin-bottom:1.5rem}
.section-head h2{font-family:var(--display);font-size:clamp(1.4rem,2.5vw,1.8rem);font-weight:800;letter-spacing:-.02em}
.section-head p{color:var(--muted);margin-top:.3rem;font-size:.9rem}
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;position:relative}
.timeline::before{content:'';position:absolute;top:28px;left:10%;right:10%;height:2px;background:var(--accent-light);z-index:0}
.tl-item{position:relative;z-index:2;text-align:center}
.tl-icon{width:56px;height:56px;border-radius:50%;background:var(--accent-light);color:var(--accent);display:grid;place-items:center;font-size:1.3rem;margin:0 auto .6rem;border:3px solid var(--bg);transition:transform .2s}
.tl-item:hover .tl-icon{transform:scale(1.1)}
.tl-item h4{font-family:var(--display);font-size:.85rem;font-weight:700;margin-bottom:.15rem}
.tl-item p{color:var(--muted);font-size:.8rem}

/* accordion */
.accordion{display:grid;gap:.6rem}
.accordion details{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:border-color .15s}
.accordion details[open]{border-color:rgba(234,88,12,.15)}
.accordion summary{list-style:none;padding:1rem 1.1rem;cursor:pointer;font-family:var(--display);font-weight:600;font-size:.95rem;display:flex;justify-content:space-between;align-items:center}
.accordion summary::-webkit-details-marker{display:none}
.accordion summary::after{content:'+';font-size:1rem;color:var(--accent);font-weight:700;transition:transform .2s}
.accordion details[open] summary::after{content:'−'}
.accordion .acc-body{padding:0 1.1rem 1rem;color:var(--muted);font-size:.88rem;line-height:1.5}

/* card prices */
.price{font-weight:800;display:block;margin-top:.5rem;color:var(--accent);font-size:1rem}
.doc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.doc-card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:transform .2s}
.doc-card:hover{transform:translateY(-3px)}
.doc-card .doc-img{aspect-ratio:1;overflow:hidden}
.doc-card .doc-img img{width:100%;height:100%;object-fit:cover}
.doc-card .doc-body{padding:1rem 1.1rem}
.doc-card h3{font-family:var(--display);font-weight:700;font-size:1rem;margin-bottom:.2rem}
.doc-card p{color:var(--muted);font-size:.85rem}

/* brand kit */
.brand-kit{margin:1rem 0 2.5rem;padding:1.25rem;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.brand-kit h2{font-family:var(--display);font-size:1.25rem;margin-bottom:.85rem}
.brand-row{margin-bottom:1rem}
.brand-row:last-child{margin-bottom:0}
.brand-label{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:.45rem}
.font-lines{display:grid;gap:.35rem;font-size:.95rem}
.font-lines strong{color:var(--accent)}
.swatches{display:flex;flex-wrap:wrap;gap:.75rem}
.swatch{display:flex;align-items:center;gap:.5rem;min-width:140px}
.swatch-sq{width:28px;height:28px;border-radius:7px;border:1px solid rgba(128,128,128,.25);flex-shrink:0}
.swatch-meta{display:flex;flex-direction:column;line-height:1.25}
.swatch-name{font-size:.82rem;font-weight:600}
.swatch-hex{font-size:.75rem;color:var(--muted);font-family:ui-monospace,monospace}
.footer{border-top:1px solid var(--line);padding:1.3rem 0 2rem;color:var(--muted);font-size:.88rem;display:flex;flex-wrap:wrap;justify-content:space-between;gap:.6rem}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .5s ease,transform .5s ease}
.reveal.visible{opacity:1;transform:translateY(0)}

@media(max-width:800px){
  .hero{grid-template-columns:1fr}
  .polaroid-stack{order:-1;max-width:300px;margin:0 auto}
  .timeline{grid-template-columns:1fr 1fr}
  .timeline::before{display:none}
  .doc-grid{grid-template-columns:1fr}
  .nav-links{display:none}
}
  </style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="../../index.html" data-i18n="back">← Ibra Studio</a>
    <div class="toggles">
      <div class="lang" aria-label="Language">
        <button type="button" class="lang-btn active" data-lang="en">EN</button>
        <button type="button" class="lang-btn" data-lang="ar">ع</button>
      </div>
      <div class="currency-toggle" aria-label="Currency">
        <button type="button" data-currency="JOD" class="active">JOD</button>
        <button type="button" data-currency="USD">USD</button>
      </div>
    </div>
  </div>
  <div class="wrap">
    <nav class="site">
      <div class="brand">Family Hub</div>
      <ul class="nav-links">
        <li data-i18n="nav1"></li>
        <li data-i18n="nav2"></li>
        <li data-i18n="nav3"></li>
      </ul>
      <a class="btn btn-a" href="#" data-i18n="nav4"></a>
    </nav>
  </div>

  <div class="wrap">
    <section class="hero">
      <div class="hero-text">
        <div class="kicker" data-i18n="kicker"></div>
        <h1 data-i18n-html="h1"></h1>
        <p class="lead" data-i18n="lead"></p>
        <div class="hero-cta">
          <a class="btn btn-a" href="#" data-i18n="cta1"></a>
          <a class="btn btn-g" href="#" data-i18n="cta2"></a>
        </div>
      </div>
      <div class="polaroid-stack">
        <div class="polaroid"><img src="../../assets/images/family/hero.jpg" alt="Family Health Hub" /><div class="caption" data-i18n="cap1"></div></div>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2 data-i18n="s_title"></h2>
        <p data-i18n="s_sub"></p>
      </div>
      <div class="timeline reveal">
        <div class="tl-item"><div class="tl-icon">👶</div><h4 data-i18n="ti1t"></h4><p data-i18n="ti1p"></p></div>
        <div class="tl-item"><div class="tl-icon">🧑</div><h4 data-i18n="ti2t"></h4><p data-i18n="ti2p"></p></div>
        <div class="tl-item"><div class="tl-icon">👩</div><h4 data-i18n="ti3t"></h4><p data-i18n="ti3p"></p></div>
        <div class="tl-item"><div class="tl-icon">👴</div><h4 data-i18n="ti4t"></h4><p data-i18n="ti4p"></p></div>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2 data-i18n="faq_title"></h2>
        <p data-i18n="faq_sub"></p>
      </div>
      <div class="accordion reveal">
        <details><summary data-i18n="q1"></summary><div class="acc-body" data-i18n="a1"></div></details>
        <details><summary data-i18n="q2"></summary><div class="acc-body" data-i18n="a2"></div></details>
        <details><summary data-i18n="q3"></summary><div class="acc-body" data-i18n="a3"></div></details>
        <details><summary data-i18n="q4"></summary><div class="acc-body" data-i18n="a4"></div></details>
      </div>
    </section>

    <section class="brand-kit" id="brand-kit">
      <h2><span data-i18n="brand_title">Brand kit</span> · Family Health Hub</h2>
      <div class="brand-row">
        <div class="brand-label" data-i18n="fonts_label">Fonts</div>
        <div class="font-lines">
          <div><strong>Figtree</strong> - <span data-i18n="font_roles">Headings</span></div>
          <div><strong>Inter</strong> - body</div>
        </div>
      </div>
      <div class="brand-row">
        <div class="brand-label" data-i18n="colors_label">Colors</div>
        <div class="swatches">
        <div class="swatch"><span class="swatch-sq" style="background:#fef7f0" title="#fef7f0"></span><span class="swatch-meta"><span class="swatch-name" data-color-en="Creamy peach" data-color-ar="خوخي كريمي">Creamy peach</span><span class="swatch-hex">#fef7f0</span></span></div>
        <div class="swatch"><span class="swatch-sq" style="background:#ea580c" title="#ea580c"></span><span class="swatch-meta"><span class="swatch-name" data-color-en="Warm amber" data-color-ar="عنبر دافئ">Warm amber</span><span class="swatch-hex">#ea580c</span></span></div>
        <div class="swatch"><span class="swatch-sq" style="background:#fed7aa" title="#fed7aa"></span><span class="swatch-meta"><span class="swatch-name" data-color-en="Soft peach" data-color-ar="خوخي ناعم">Soft peach</span><span class="swatch-hex">#fed7aa</span></span></div>
        <div class="swatch"><span class="swatch-sq" style="background:#8b6f5a" title="#8b6f5a"></span><span class="swatch-meta"><span class="swatch-name" data-color-en="Taupe" data-color-ar="بني داكن">Taupe</span><span class="swatch-hex">#8b6f5a</span></span></div>
        <div class="swatch"><span class="swatch-sq" style="background:#ffffff" title="#ffffff"></span><span class="swatch-meta"><span class="swatch-name" data-color-en="White" data-color-ar="أبيض">White</span><span class="swatch-hex">#ffffff</span></span></div>
        </div>
      </div>
    </section>
    <footer class="footer">
      <span data-i18n="foot"></span>
      <span>EN · AR · JOD · USD</span>
    </footer>
  </div>
  <script src="../shared/lang.js"></script>
  <script src="../../js/currency.js"></script>
  <script>
    var DICT = {"en": {"back": "← Ibra Studio", "nav1": "About", "nav2": "Services", "nav3": "FAQ", "nav4": "Book now", "kicker": "Family medicine · Amman", "h1": "Care for every <span>stage of life.</span>", "lead": "From newborns to grandparents - we treat your whole family like our own.", "cta1": "Book an appointment", "cta2": "Our services", "cap1": "Our team at the clinic", "s_title": "Care through the years", "s_sub": "Compassionate care at every age.", "ti1t": "Newborn & child", "ti1p": "Vaccinations, wellness checks, and developmental screenings.", "ti2t": "Teen & adult", "ti2p": "Annual physicals, sports medicine, and sexual health.", "ti3t": "Women's health", "ti3p": "Prenatal care, Pap smears, and menopause management.", "ti4t": "Senior care", "ti4p": "Chronic disease management, mobility, and geriatric assessments.", "faq_title": "Common questions", "faq_sub": "Everything you need to know about visiting us.", "q1": "What should I bring to my first visit?", "a1": "Bring your ID, insurance card, a list of current medications, and any previous medical records if available.", "q2": "Do you accept walk-ins?", "a2": "Yes, we accept walk-ins during clinic hours. However, appointments are recommended for shorter wait times.", "q3": "What insurance plans do you accept?", "a3": "We accept most major insurance plans. Call us to verify your specific coverage.", "q4": "Do you offer telemedicine?", "a4": "Yes, virtual consultations are available for follow-ups and minor concerns.", "suffix": "", "brand_title": "Brand kit", "fonts_label": "Fonts", "colors_label": "Colors", "font_roles": "Headings", "foot": "Family Health Hub · Ibra Studio template"}, "ar": {"back": "← Ibra Studio", "nav1": "عن العيادة", "nav2": "الخدمات", "nav3": "الأسئلة", "nav4": "احجز الآن", "kicker": "طب عائلي · عمّان", "h1": "رعاية لكل <span>مرحلة عمرية.</span>", "lead": "من الأطفال إلى الأجداد - نعالج عائلتك كأنها عائلتنا.", "cta1": "احجز موعد", "cta2": "خدماتنا", "cap1": "فريقنا في العيادة", "s_title": "رعاية عبر السنوات", "s_sub": "رعاية متعاطفة في كل عمر.", "ti1t": "رضع وأطفال", "ti1p": "تطعيمات وفحوصات نمو وتطور.", "ti2t": "مراهقون وبالغون", "ti2p": "فحوصات سنوية وطب رياضي وصحة جنسية.", "ti3t": "صحة المرأة", "ti3p": "رعاية حمل ومسحات عنق رحم وإدارة سن اليأس.", "ti4t": "رعاية المسنين", "ti4p": "إدارة الأمراض المزمنة والحركة وتقييم الشيخوخة.", "faq_title": "أسئلة شائعة", "faq_sub": "كل ما تحتاج معرفته عن زيارتنا.", "q1": "ماذا أحضر لأول زيارة؟", "a1": "أحضر هويتك وبطاقة التأمين وقائمة الأدوية وأي سجلات طبية سابقة.", "q2": "هل تستقبلون زيارات بدون موعد؟", "a2": "نعم، نستقبل الزيارات المباشرة خلال ساعات العمل. لكن الموعد أفضل لوقت انتظار أقصر.", "q3": "ما هي شركات التأمين التي تقبلونها؟", "a3": "نقبل معظم شركات التأمين الكبرى. اتصل بنا للتحقق من تغطيتك.", "q4": "هل تقدمون استشارات عن بُعد؟", "a4": "نعم، الاستشارات الافتراضية متاحة للمتابعات والاستشارات البسيطة.", "suffix": "", "brand_title": "هوية العلامة", "fonts_label": "الخطوط", "colors_label": "الألوان", "font_roles": "العناوين", "foot": "مركز صحة العائلة · قالب Ibra Studio"}};
    var COLORS = [{"hex": "#fef7f0", "en": "Creamy peach", "ar": "خوخي كريمي"}, {"hex": "#ea580c", "en": "Warm amber", "ar": "عنبر دافئ"}, {"hex": "#fed7aa", "en": "Soft peach", "ar": "خوخي ناعم"}, {"hex": "#8b6f5a", "en": "Taupe", "ar": "بني داكن"}, {"hex": "#ffffff", "en": "White", "ar": "أبيض"}];

    function observeReveal() {
      document.querySelectorAll(".reveal").forEach(function (el) {
        var obs = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (e.isIntersecting) { el.classList.add("visible"); obs.unobserve(el); }
          });
        }, {threshold: 0.1});
        obs.observe(el);
      });
    }
    function paintColorNames(lang) {
      document.querySelectorAll("[data-color-en]").forEach(function (el) {
        el.textContent = lang === "ar" ? el.getAttribute("data-color-ar") : el.getAttribute("data-color-en");
      });
    }
    function applySuffix() {
      var lang = document.documentElement.lang === "ar" ? "ar" : "en";
      var suf = (DICT[lang] && DICT[lang].suffix) || "";
      document.querySelectorAll(".money-price").forEach(function (el) {
        el.setAttribute("data-suffix", suf);
      });
      if (window.IbraMoney) IbraMoney.applyAll();
    }
    var _init = IbraLang.init;
    IbraLang.init = function (dict) {
      _init(dict);
      paintColorNames(document.documentElement.lang === "ar" ? "ar" : "en");
      applySuffix();
      document.querySelectorAll(".lang-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          setTimeout(function () {
            paintColorNames(btn.getAttribute("data-lang"));
            applySuffix();
          }, 0);
        });
      });
    };
    IbraLang.init(DICT);
    document.addEventListener("ibra-currency", applySuffix);
    observeReveal();
  </script>
</body>
