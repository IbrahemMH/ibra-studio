<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreshBasket Market · Ibra Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
:root{--display:'Fredoka';--body:'Nunito';--bg:#fefcf7;--text:#1a2a1f;--muted:#6f8575;--card:#ffffff;--line:rgba(26,42,31,.08);--accent:#16a34a;--accent-light:#dcfce7;--accent-warm:#fdba74;--on-accent:#fff;--max:1080px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body),system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;overflow-x:hidden}
html[dir="rtl"] body{font-family:"IBM Plex Sans Arabic",var(--body),system-ui,sans-serif}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%;height:100%;object-fit:cover}
.wrap{width:min(100% - 2rem,var(--max,1040px));margin:0 auto}

/* topbar */
.topbar{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:.55rem 1rem;background:rgba(254,252,247,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.back{font-size:.85rem;font-weight:600;opacity:.8}
.toggles{display:flex;gap:.45rem;align-items:center;flex-wrap:wrap}
.lang,.currency-toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:rgba(22,163,74,.06)}
.lang-btn,.currency-toggle button{border:0;background:transparent;color:var(--muted);padding:.32rem .65rem;cursor:pointer;font-weight:700;font-size:.78rem}
.lang-btn.active,.currency-toggle button.active{background:var(--accent-light);color:var(--accent)}
nav.site{display:flex;justify-content:space-between;align-items:center;padding:1.1rem 0;gap:1rem}
.brand{font-family:var(--display);font-weight:700;font-size:1.3rem;letter-spacing:-.02em;color:var(--accent)}
.nav-links{display:flex;gap:1rem;list-style:none;color:var(--muted);font-size:.9rem;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:.72rem 1.2rem;font-weight:700;font-size:.92rem;border:0;cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn-a{background:var(--accent);color:var(--on-accent)}
.btn-g{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn-g:hover{background:rgba(22,163,74,.04)}

/* hero — full image banner with floating tags */
.hero{position:relative;border-radius:24px;overflow:hidden;min-height:380px;margin-bottom:1.5rem}
.hero img{width:100%;height:380px;object-fit:cover}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,rgba(22,163,74,.08) 0%,rgba(253,186,116,.06) 60%,transparent 100%)}
.hero-content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:2rem;z-index:2}
.hero-content .kicker{display:inline-block;background:rgba(255,255,255,.5);backdrop-filter:blur(4px);color:var(--accent);font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:.3rem .8rem;border-radius:999px;margin-bottom:.8rem;align-self:flex-start}
.hero-content h1{font-family:var(--display);font-size:clamp(2rem,4.5vw,3.2rem);color:#fff;line-height:1.08;letter-spacing:-.02em;margin-bottom:.5rem;text-shadow:0 2px 16px rgba(0,0,0,.15)}
.hero-content .lead{color:rgba(255,255,255,.9);font-size:1rem;max-width:28rem;margin-bottom:1rem}
.hero-cta{display:flex;flex-wrap:wrap;gap:.6rem}
.hero-cta .btn-a{background:#fff;color:var(--accent);box-shadow:0 4px 20px rgba(0,0,0,.1)}

/* floating price tags on hero */
.float-tags{position:absolute;inset:0;pointer-events:none;z-index:3}
.float-tag{position:absolute;background:rgba(255,255,255,.45);backdrop-filter:blur(8px);border-radius:999px;padding:.25rem .7rem;font-family:var(--display);font-size:.75rem;font-weight:600;color:var(--accent);animation:float 3s ease-in-out infinite;border:1px solid rgba(255,255,255,.3)}
.float-tag:nth-child(1){top:15%;right:12%;animation-delay:0s}
.float-tag:nth-child(2){top:45%;right:5%;animation-delay:.6s}
.float-tag:nth-child(3){bottom:20%;right:18%;animation-delay:1.2s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* category pills */
.pills{display:flex;gap:.5rem;overflow-x:auto;padding:.5rem 0;margin-bottom:1.5rem;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.45rem 1rem;font-size:.82rem;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap}
.pill:hover,.pill.active{background:var(--accent-light);color:var(--accent);border-color:var(--accent)}

/* section */
.section{padding:1.8rem 0 2.5rem}
.section-head{margin-bottom:1.5rem}
.section-head h2{font-family:var(--display);font-size:clamp(1.4rem,2.5vw,1.8rem);color:var(--accent);letter-spacing:-.02em}
.section-head p{color:var(--muted);margin-top:.3rem;font-size:.9rem}

/* shelf cards — 3D perspective */
.shelf-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.shelf-card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:transform .25s,box-shadow .25s;transform:perspective(1000px) rotateX(0) translateZ(0);cursor:default}
.shelf-card:hover{transform:perspective(1000px) rotateX(2deg) translateZ(8px);box-shadow:0 16px 40px rgba(22,163,74,.1),0 0 0 1px rgba(22,163,74,.08)}
.shelf-card .card-img{aspect-ratio:16/11;overflow:hidden;border-bottom:1px solid var(--line)}
.shelf-card .card-img img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.shelf-card:hover .card-img img{transform:scale(1.05)}
.shelf-card .card-body{padding:.9rem 1rem 1rem}
.shelf-card .tag-row{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.35rem}
.shelf-card .prod-tag{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);background:var(--accent-light);border-radius:999px;padding:.15rem .45rem}
.shelf-card h3{font-family:var(--display);font-size:1.05rem;margin-bottom:.2rem}
.shelf-card p{color:var(--muted);font-size:.85rem}
.price{font-family:var(--display);display:block;margin-top:.5rem;color:var(--accent);font-weight:600;font-size:1.1rem}

/* brand kit */
.brand-kit{margin:1rem 0 2.5rem;padding:1.25rem;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.brand-kit h2{font-family:var(--display);font-size:1.25rem;margin-bottom:.85rem;color:var(--accent)}
.brand-row{margin-bottom:1rem}
.brand-row:last-child{margin-bottom:0}
.brand-label{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:.45rem}
.font-lines{display:grid;gap:.35rem;font-size:.95rem}
.font-lines strong{color:var(--accent)}
.swatches{display:flex;flex-wrap:wrap;gap:.75rem}
.swatch{display:flex;align-items:center;gap:.5rem;min-width:140px}
.swatch-sq{width:28px;height:28px;border-radius:7px;border:1px solid rgba(128,128,128,.25);flex-shrink:0}
.swatch-meta{display:flex;flex-direction:column;line-height:1.25}
.swatch-name{font-size:.82rem;font-weight:600}
.swatch-hex{font-size:.75rem;color:var(--muted);font-family:ui-monospace,monospace}
.footer{border-top:1px solid var(--line);padding:1.3rem 0 2rem;color:var(--muted);font-size:.88rem;display:flex;flex-wrap:wrap;justify-content:space-between;gap:.6rem}

/* reveal */
.reveal{opacity:0;transform:translateY(20px);transition:opacity .5s ease,transform .5s ease}
.reveal.visible{opacity:1;transform:translateY(0)}

@media(max-width:800px){
  .shelf-grid{grid-template-columns:1fr}
  .hero{min-height:320px}
  .hero img{height:320px}
  .float-tags{display:none}
  .nav-links{display:none}
}
  </style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="../../index.html" data-i18n="back">← Ibra Studio</a>
    <div class="toggles">
      <div class="lang" aria-label="Language">
        <button type="button" class="lang-btn active" data-lang="en">EN</button>
        <button type="button" class="lang-btn" data-lang="ar">ع</button>
      </div>
      <div class="currency-toggle" aria-label="Currency">
        <button type="button" data-currency="JOD" class="active">JOD</button>
        <button type="button" data-currency="USD">USD</button>
      </div>
    </div>
  </div>
  <div class="wrap">
    <nav class="site">
      <div class="brand">FreshBasket</div>
      <ul class="nav-links">
        <li data-i18n="nav1"></li>
        <li data-i18n="nav2"></li>
        <li data-i18n="nav3"></li>
      </ul>
      <a class="btn btn-a" href="#" data-i18n="nav4"></a>
    </nav>
  </div>

  <!-- hero: image banner + floating price tags -->
  <div class="wrap">
    <section class="hero">
      <img src="../../assets/images/market/hero.jpg" alt="FreshBasket Market" />
      <div class="hero-content">
        <div class="kicker" data-i18n="kicker"></div>
        <h1 data-i18n-html="h1"></h1>
        <p class="lead" data-i18n="lead"></p>
        <div class="hero-cta">
          <a class="btn btn-a" href="#" data-i18n="cta1"></a>
          <a class="btn btn-g" href="#" data-i18n="cta2"></a>
        </div>
      </div>
      <div class="float-tags">
        <span class="float-tag">1.99 JOD</span>
        <span class="float-tag">0.50 JOD</span>
        <span class="float-tag">%20 off</span>
      </div>
    </section>
  </div>

  <div class="wrap">
    <!-- category pills -->
    <div class="pills">
      <span class="pill active" data-i18n="pi1"></span>
      <span class="pill" data-i18n="pi2"></span>
      <span class="pill" data-i18n="pi3"></span>
      <span class="pill" data-i18n="pi4"></span>
      <span class="pill" data-i18n="pi5"></span>
      <span class="pill" data-i18n="pi6"></span>
    </div>

    <!-- shelf cards -->
    <section class="section">
      <div class="section-head">
        <h2 data-i18n="s_title"></h2>
        <p data-i18n="s_sub"></p>
      </div>
      <div class="shelf-grid">
        <article class="shelf-card reveal">
          <div class="card-img"><img src="../../assets/images/market/card1.jpg" alt="" loading="lazy" /></div>
          <div class="card-body"><div class="tag-row"><span class="prod-tag" data-i18n="t1"></span></div><h3 data-i18n="c1t"></h3><p data-i18n="c1p"></p><span class="price money-price" data-jod="12"></span></div>
        </article>
        <article class="shelf-card reveal">
          <div class="card-img"><img src="../../assets/images/market/card2.jpg" alt="" loading="lazy" /></div>
          <div class="card-body"><div class="tag-row"><span class="prod-tag" data-i18n="t2"></span><span class="prod-tag" data-i18n="t3"></span></div><h3 data-i18n="c2t"></h3><p data-i18n="c2p"></p><span class="price money-price" data-jod="18"></span></div>
        </article>
        <article class="shelf-card reveal">
          <div class="card-img"><img src="../../assets/images/market/card3.jpg" alt="" loading="lazy" /></div>
          <div class="card-body"><div class="tag-row"><span class="prod-tag" data-i18n="t2"></span></div><h3 data-i18n="c3t"></h3><p data-i18n="c3p"></p><span class="price money-price" data-jod="25"></span></div>
        </article>
      </div>
    </section>

    <!-- brand kit -->
    <section class="brand-kit" id="brand-kit">
      <h2><span data-i18n="brand_title">Brand kit</span> · FreshBasket Market</h2>
      <div class="brand-row">
        <div class="brand-label" data-i18n="fonts_label">Fonts</div>
        <div class="font-lines">
          <div><strong>Fredoka</strong> — <span data-i18n="font_roles">Headings</span></div>
          <div><strong>Nunito</strong> — body</div>
        </div>
      </div>
      <div class="brand-row">
        <div class="brand-label" data-i18n="colors_label">Colors</div>
        <div class="swatches">
        <div class="swatch"><span class="swatch-sq" style="background:#fefcf7" title="#fefcf7"></span><span class="swatch-meta"><span class="swatch-name" data-color-en="Cream white" data-color-ar="أبيض كريمي">Cream white</span><span class="swatch-hex">#fefcf7</span></span></div>
        <div class="swatch"><span class="swatch-sq" style="background:#16a34a" title="#16a34a"></span><span class="swatch-meta"><span class="swatch-name" data-color-en="Fresh green" data-color-ar="أخضر منعش">Fresh green</span><span class="swatch-hex">#16a34a</span></span></div>
        <div class="swatch"><span class="swatch-sq" style="background:#fdba74" title="#fdba74"></span><span class="swatch-meta"><span class="swatch-name" data-color-en="Warm orange" data-color-ar="برتقالي دافئ">Warm orange</span><span class="swatch-hex">#fdba74</span></span></div>
        <div class="swatch"><span class="swatch-sq" style="background:#6f8575" title="#6f8575"></span><span class="swatch-meta"><span class="swatch-name" data-color-en="Sage" data-color-ar="مريمية">Sage</span><span class="swatch-hex">#6f8575</span></span></div>
        <div class="swatch"><span class="swatch-sq" style="background:#ffffff" title="#ffffff"></span><span class="swatch-meta"><span class="swatch-name" data-color-en="White" data-color-ar="أبيض">White</span><span class="swatch-hex">#ffffff</span></span></div>
        </div>
      </div>
    </section>
    <footer class="footer">
      <span data-i18n="foot"></span>
      <span>EN · AR · JOD · USD</span>
    </footer>
  </div>
  <script src="../shared/lang.js"></script>
  <script src="../../js/currency.js"></script>
  <script>
    var DICT = {"en": {"back": "← Ibra Studio", "nav1": "Products", "nav2": "Deals", "nav3": "Delivery", "nav4": "Shop", "kicker": "Supermarket · Amman", "h1": "Fresh<span>every day.</span>", "lead": "Quality produce, pantry staples, and everyday essentials delivered to your door.", "cta1": "Start shopping", "cta2": "View deals", "pi1": "All", "pi2": "Fruits", "pi3": "Veggies", "pi4": "Dairy", "pi5": "Bakery", "pi6": "Beverages", "s_title": "Weekly specials", "s_sub": "Best prices on fresh picks this week.", "t1": "Organic", "t2": "Fresh", "t3": "Bulk deal", "c1t": "Seasonal Fruit Box", "c1p": "Mixed seasonal fruits handpicked for sweetness.", "c2t": "Farm Veggie Pack", "c2p": "Locally grown vegetables — perfect for the week.", "c3t": "Gourmet Basket", "c3p": "Premium cheeses, olives, crackers, and dips.", "suffix": " JOD", "brand_title": "Brand kit", "fonts_label": "Fonts", "colors_label": "Colors", "font_roles": "Headings", "foot": "FreshBasket Market · Ibra Studio template"}, "ar": {"back": "← Ibra Studio", "nav1": "المنتجات", "nav2": "العروض", "nav3": "التوصيل", "nav4": "تسوق", "kicker": "سوبرماركت · عمّان", "h1": "طازج<span>كل يوم.</span>", "lead": "منتجات طازجة ومواد غذائية أساسية يومياً توصيل إلى باب منزلك.", "cta1": "ابدأ التسوق", "cta2": "عرض العروض", "pi1": "الكل", "pi2": "فواكه", "pi3": "خضروات", "pi4": "ألبان", "pi5": "مخبوزات", "pi6": "مشروبات", "s_title": "عروض الأسبوع", "s_sub": "أفضل الأسعار على المنتجات الطازجة هذا الأسبوع.", "t1": "عضوي", "t2": "طازج", "t3": "عرض بالجملة", "c1t": "صندوق الفواكه الموسمية", "c1p": "فواكه موسمية مشكلة منتقاة للحلاوة.", "c2t": "حزمة خضروات المزرعة", "c2p": "خضروات مزروعة محلياً — مثالية للأسبوع.", "c3t": "سلة الذواقة", "c3p": "أجبان وزيتون ومقرمشات وصلصات فاخرة.", "suffix": " دينار", "brand_title": "هوية العلامة", "fonts_label": "الخطوط", "colors_label": "الألوان", "font_roles": "العناوين", "foot": "فريش باسكت · قالب Ibra Studio"}};
    var COLORS = [{"hex": "#fefcf7", "en": "Cream white", "ar": "أبيض كريمي"}, {"hex": "#16a34a", "en": "Fresh green", "ar": "أخضر منعش"}, {"hex": "#fdba74", "en": "Warm orange", "ar": "برتقالي دافئ"}, {"hex": "#6f8575", "en": "Sage", "ar": "مريمية"}, {"hex": "#ffffff", "en": "White", "ar": "أبيض"}];

    function observeReveal() {
      document.querySelectorAll(".reveal").forEach(function (el) {
        var obs = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (e.isIntersecting) { el.classList.add("visible"); obs.unobserve(el); }
          });
        }, {threshold: 0.1});
        obs.observe(el);
      });
    }
    function paintColorNames(lang) {
      document.querySelectorAll("[data-color-en]").forEach(function (el) {
        el.textContent = lang === "ar" ? el.getAttribute("data-color-ar") : el.getAttribute("data-color-en");
      });
    }
    function applySuffix() {
      var lang = document.documentElement.lang === "ar" ? "ar" : "en";
      var suf = (DICT[lang] && DICT[lang].suffix) || "";
      document.querySelectorAll(".money-price").forEach(function (el) {
        el.setAttribute("data-suffix", suf);
      });
      if (window.IbraMoney) IbraMoney.applyAll();
    }
    var _init = IbraLang.init;
    IbraLang.init = function (dict) {
      _init(dict);
      paintColorNames(document.documentElement.lang === "ar" ? "ar" : "en");
      applySuffix();
      document.querySelectorAll(".lang-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          setTimeout(function () {
            paintColorNames(btn.getAttribute("data-lang"));
            applySuffix();
          }, 0);
        });
      });
    };
    IbraLang.init(DICT);
    document.addEventListener("ibra-currency", applySuffix);
    observeReveal();
  </script>
</body>
</html>
