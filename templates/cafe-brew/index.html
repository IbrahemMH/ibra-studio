<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brew & Bean Cafe · Ibra Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
:root{--display:'Playfair Display';--body:'Inter';--bg:#f5efe8;--text:#2c1810;--muted:#7a5c44;--card:#ffffff;--line:rgba(44,24,16,.06);--accent:#6f4e37;--accent-light:#e6d5c3;--on-accent:#fff;--max:1080px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body),system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 20% 30%,rgba(111,78,55,.02) 0,transparent 40%),radial-gradient(circle at 80% 70%,rgba(111,78,55,.015) 0,transparent 40%);pointer-events:none;z-index:-1}
html[dir="rtl"] body{font-family:"IBM Plex Sans Arabic",var(--body),system-ui,sans-serif}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%;height:100%;object-fit:cover}
.wrap{width:min(100% - 2rem,var(--max,1040px));margin:0 auto}
.topbar{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:.55rem 1rem;background:rgba(245,239,232,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.back{font-size:.85rem;font-weight:600;opacity:.8}
.toggles{display:flex;gap:.45rem;align-items:center;flex-wrap:wrap}
.lang,.currency-toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:rgba(111,78,55,.06)}
.lang-btn,.currency-toggle button{border:0;background:transparent;color:var(--muted);padding:.32rem .65rem;cursor:pointer;font-weight:700;font-size:.78rem}
.lang-btn.active,.currency-toggle button.active{background:var(--accent);color:#fff}
nav.site{display:flex;justify-content:space-between;align-items:center;padding:1.1rem 0;gap:1rem}
.brand{font-family:var(--display);font-style:italic;font-size:1.3rem;color:var(--accent)}
.nav-links{display:flex;gap:1rem;list-style:none;color:var(--muted);font-size:.9rem;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:.72rem 1.2rem;font-weight:600;font-size:.92rem;border:0;cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn-a{background:var(--accent);color:var(--on-accent)}
.btn-g{background:transparent;border:1px solid var(--line);color:var(--text)}

/* hero */
.hero{display:grid;grid-template-columns:.9fr 1.1fr;gap:2rem;align-items:center;padding:2rem 0 1rem}
.hero-visual{min-height:320px;position:relative}
.hero-img-wrap{position:absolute;inset:0;border-radius:50% 50% 50% 50% / 40% 40% 60% 60%;overflow:hidden;border:6px solid var(--accent-light);box-shadow:0 20px 50px rgba(111,78,55,.06)}
.hero-img-wrap img{width:100%;height:100%;object-fit:cover}
.hero-text .kicker{font-family:var(--display);font-style:italic;font-size:.9rem;color:var(--accent);margin-bottom:.3rem}
.hero-text h1{font-family:var(--display);font-size:clamp(2rem,4.5vw,3rem);line-height:1.08;letter-spacing:-.02em;font-weight:600;margin-bottom:.5rem}
.hero-text .lead{color:var(--muted);font-size:.95rem;margin-bottom:1.2rem}
.hero-cta{display:flex;flex-wrap:wrap;gap:.6rem}

/* hanging board menu */
.hanging-board{background:var(--card);border:1px solid var(--line);border-radius:0;padding:1.5rem 1.2rem;position:relative;margin-bottom:2rem;box-shadow:0 4px 20px rgba(111,78,55,.04)}
.hanging-board::before{content:'';position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;border:1px solid var(--line);background:var(--bg)}
.hanging-board .hb-title{font-family:var(--display);font-style:italic;font-size:1.1rem;text-align:center;margin-bottom:.8rem;color:var(--accent);border-bottom:1px dashed var(--accent-light);padding-bottom:.4rem}
.hanging-board .hb-item{display:flex;justify-content:space-between;padding:.4rem 0;gap:.5rem;border-bottom:1px solid var(--line)}
.hanging-board .hb-item:last-child{border-bottom:none}
.hanging-board .hb-item .hb-name{font-weight:500}
.hanging-board .hb-item .hb-price{font-weight:700;color:var(--accent)}

/* staggered gallery */
.section{padding:1.5rem 0 2.5rem}
.section-head{text-align:center;margin-bottom:1.2rem}
.section-head h2{font-family:var(--display);font-size:clamp(1.3rem,2.5vw,1.7rem);font-weight:600;letter-spacing:-.02em}
.section-head p{color:var(--muted);margin-top:.2rem;font-size:.9rem}

.stagger-gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;align-items:start}
.stagger-gallery .sg-item:nth-child(2){margin-top:2rem}
.stagger-gallery .sg-item:nth-child(3){margin-top:.5rem}
.sg-item{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:transform .2s}
.sg-item:hover{transform:translateY(-4px)}
.sg-item .sg-img{aspect-ratio:1;overflow:hidden}
.sg-item .sg-img img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.sg-item:hover .sg-img img{transform:scale(1.04)}
.sg-item .sg-body{padding:.8rem .9rem .9rem;text-align:center}
.sg-item .sg-tag{font-size:.6rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:.15rem}
.sg-item h3{font-family:var(--display);font-size:.95rem;font-weight:600;margin-bottom:.1rem}
.sg-item p{color:var(--muted);font-size:.8rem}
.sg-item .price{font-weight:700;display:block;margin-top:.3rem;color:var(--accent);font-size:.9rem}

/* brand kit */
.brand-kit{margin:1rem 0 2.5rem;padding:1.25rem;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.brand-kit h2{font-family:var(--display);font-size:1.25rem;margin-bottom:.85rem;font-style:italic}
.brand-row{margin-bottom:1rem}
.brand-row:last-child{margin-bottom:0}
.brand-label{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:.45rem}
.font-lines{display:grid;gap:.35rem;font-size:.95rem}
.font-lines strong{color:var(--accent)}
.swatches{display:flex;flex-wrap:wrap;gap:.75rem}
.swatch{display:flex;align-items:center;gap:.5rem;min-width:140px}
.swatch-sq{width:28px;height:28px;border-radius:7px;border:1px solid rgba(128,128,128,.25);flex-shrink:0}
.swatch-meta{display:flex;flex-direction:column;line-height:1.25}
.swatch-name{font-size:.82rem;font-weight:600}
.swatch-hex{font-size:.75rem;color:var(--muted);font-family:ui-monospace,monospace}
.footer{border-top:1px solid var(--line);padding:1.3rem 0 2rem;color:var(--muted);font-size:.88rem;display:flex;flex-wrap:wrap;justify-content:space-between;gap:.6rem}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .5s ease,transform .5s ease}
.reveal.visible{opacity:1;transform:translateY(0)}

@media(max-width:800px){
  .hero{grid-template-columns:1fr;padding:1rem 0}
  .hero-visual{min-height:260px;order:-1}
  .hero-img-wrap{border-radius:50%;width:260px;height:260px;margin:0 auto;position:relative}
  .stagger-gallery{grid-template-columns:1fr}
  .stagger-gallery .sg-item:nth-child(2){margin-top:0}
  .nav-links{display:none}
}
  </style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="../../index.html" data-i18n="back">← Ibra Studio</a>
    <div class="toggles">
      <div class="lang" aria-label="Language">
        <button type="button" class="lang-btn active" data-lang="en">EN</button>
        <button type="button" class="lang-btn" data-lang="ar">ع</button>
      </div>
      <div class="currency-toggle" aria-label="Currency">
        <button type="button" data-currency="JOD" class="active">JOD</button>
        <button type="button" data-currency="USD">USD</button>
      </div>
    </div>
  </div>
  <div class="wrap">
    <nav class="site">
      <div class="brand">Brew & Bean</div>
      <ul class="nav-links">
        <li data-i18n="nav1"></li>
        <li data-i18n="nav2"></li>
        <li data-i18n="nav3"></li>
      </ul>
      <a class="btn btn-a" href="#" data-i18n="nav4"></a>
    </nav>
  </div>

  <div class="wrap">
    <section class="hero">
      <div class="hero-visual">
        <div class="hero-img-wrap"><img src="../../assets/images/cafe/hero.jpg" alt="Brew & Bean Cafe" /></div>
      </div>
      <div class="hero-text">
        <div class="kicker" data-i18n="kicker"></div>
        <h1 data-i18n-html="h1"></h1>
        <p class="lead" data-i18n="lead"></p>
        <div class="hero-cta">
          <a class="btn btn-a" href="#" data-i18n="cta1"></a>
          <a class="btn btn-g" href="#" data-i18n="cta2"></a>
        </div>
      </div>
    </section>

    <div class="hanging-board reveal">
      <div class="hb-title" data-i18n="hb_title"></div>
      <div class="hb-item"><span class="hb-name" data-i18n="h1n"></span><span class="hb-price" data-i18n="h1p"></span></div>
      <div class="hb-item"><span class="hb-name" data-i18n="h2n"></span><span class="hb-price" data-i18n="h2p"></span></div>
      <div class="hb-item"><span class="hb-name" data-i18n="h3n"></span><span class="hb-price" data-i18n="h3p"></span></div>
      <div class="hb-item"><span class="hb-name" data-i18n="h4n"></span><span class="hb-price" data-i18n="h4p"></span></div>
      <div class="hb-item"><span class="hb-name" data-i18n="h5n"></span><span class="hb-price" data-i18n="h5p"></span></div>
    </div>

    <section class="section">
      <div class="section-head">
        <h2 data-i18n="s_title"></h2>
        <p data-i18n="s_sub"></p>
      </div>
      <div class="stagger-gallery reveal">
        <div class="sg-item"><div class="sg-img"><img src="../../assets/images/cafe/card1.jpg" alt="" loading="lazy" /></div><div class="sg-body"><div class="sg-tag" data-i18n="t1"></div><h3 data-i18n="c1t"></h3><p data-i18n="c1p"></p><span class="price money-price" data-jod="3"></span></div></div>
        <div class="sg-item"><div class="sg-img"><img src="../../assets/images/cafe/card2.jpg" alt="" loading="lazy" /></div><div class="sg-body"><div class="sg-tag" data-i18n="t2"></div><h3 data-i18n="c2t"></h3><p data-i18n="c2p"></p><span class="price money-price" data-jod="4"></span></div></div>
        <div class="sg-item"><div class="sg-img"><img src="../../assets/images/cafe/card3.jpg" alt="" loading="lazy" /></div><div class="sg-body"><div class="sg-tag" data-i18n="t3"></div><h3 data-i18n="c3t"></h3><p data-i18n="c3p"></p><span class="price money-price" data-jod="5"></span></div></div>
      </div>
    </section>

    <section class="brand-kit" id="brand-kit">
      <h2><span data-i18n="brand_title">Brand kit</span> · Brew & Bean Cafe</h2>
      <div class="brand-row">
        <div class="brand-label" data-i18n="fonts_label">Fonts</div>
        <div class="font-lines">
          <div><strong>Playfair Display</strong> - <span data-i18n="font_roles">Headings</span></div>
          <div><strong>Inter</strong> - body</div>
        </div>
      </div>
      <div class="brand-row">
        <div class="brand-label" data-i18n="colors_label">Colors</div>
        <div class="swatches">
        <div class="swatch"><span class="swatch-sq" style="background:#f5efe8" title="#f5efe8"></span><span class="swatch-meta"><span class="swatch-name" data-color-en="Warm latte" data-color-ar="لاتيه دافئ">Warm latte</span><span class="swatch-hex">#f5efe8</span></span></div>
        <div class="swatch"><span class="swatch-sq" style="background:#6f4e37" title="#6f4e37"></span><span class="swatch-meta"><span class="swatch-name" data-color-en="Coffee brown" data-color-ar="بني القهوة">Coffee brown</span><span class="swatch-hex">#6f4e37</span></span></div>
        <div class="swatch"><span class="swatch-sq" style="background:#e6d5c3" title="#e6d5c3"></span><span class="swatch-meta"><span class="swatch-name" data-color-en="Cream foam" data-color-ar="رغوة كريمية">Cream foam</span><span class="swatch-hex">#e6d5c3</span></span></div>
        <div class="swatch"><span class="swatch-sq" style="background:#7a5c44" title="#7a5c44"></span><span class="swatch-meta"><span class="swatch-name" data-color-en="Mocha" data-color-ar="موكا">Mocha</span><span class="swatch-hex">#7a5c44</span></span></div>
        <div class="swatch"><span class="swatch-sq" style="background:#ffffff" title="#ffffff"></span><span class="swatch-meta"><span class="swatch-name" data-color-en="White" data-color-ar="أبيض">White</span><span class="swatch-hex">#ffffff</span></span></div>
        </div>
      </div>
    </section>
    <footer class="footer">
      <span data-i18n="foot"></span>
      <span>EN · AR · JOD · USD</span>
    </footer>
  </div>
  <script src="../shared/lang.js"></script>
  <script src="../../js/currency.js"></script>
  <script>
    var DICT = {"en": {"back": "← Ibra Studio", "nav1": "Menu", "nav2": "Our Story", "nav3": "Hours", "nav4": "Order", "kicker": "Coffee & conversation", "h1": "Brewed<span>with care.</span>", "lead": "Specialty coffee, house-made pastries, and a cozy corner for slow mornings.", "cta1": "See the menu", "cta2": "Find us", "hb_title": "Drinks - Hanging Board", "h1n": "Espresso", "h1p": "2 JOD", "h2n": "Flat White", "h2p": "3 JOD", "h3n": "Iced Latte", "h3p": "3.5 JOD", "h4n": "Pour Over", "h4p": "4 JOD", "h5n": "Matcha Latte", "h5p": "3.5 JOD", "s_title": "From the counter", "s_sub": "Made in-house, fresh daily.", "t1": "Coffee", "t2": "Pastry", "t3": "Special", "c1t": "Cortado", "c1p": "Double espresso with a touch of warm milk.", "c2t": "Cinnamon Roll", "c2p": "Freshly baked with cream cheese icing.", "c3t": "Cold Brew", "c3p": "Slow-steeped 24 hours, served over ice.", "suffix": "", "brand_title": "Brand kit", "fonts_label": "Fonts", "colors_label": "Colors", "font_roles": "Headings", "foot": "Brew & Bean Cafe · Ibra Studio template"}, "ar": {"back": "← Ibra Studio", "nav1": "القائمة", "nav2": "قصتنا", "nav3": "ساعات العمل", "nav4": "اطلب", "kicker": "قهوة وأحاديث", "h1": "مخمرة<span>باهتمام.</span>", "lead": "قهوة اختصاصية ومعجنات منزلية وركن دافئ لصباحات هادئة.", "cta1": "شاهد القائمة", "cta2": "موقعنا", "hb_title": "مشروبات - لوحة معلقة", "h1n": "إسبريسو", "h1p": "٢ دينار", "h2n": "فلات وايت", "h2p": "٣ دينار", "h3n": "لاتيه مثلج", "h3p": "٣.٥ دينار", "h4n": "Pour Over", "h4p": "٤ دينار", "h5n": "ماتشا لاتيه", "h5p": "٣.٥ دينار", "s_title": "من الكاونتر", "s_sub": "مصنوع داخلياً، طازج يومياً.", "t1": "قهوة", "t2": "معجنات", "t3": "اختصاص", "c1t": "كورتادو", "c1p": "إسبريسو مزدوج مع لمسة حليب دافئ.", "c2t": "لفة القرفة", "c2p": "مخبوزة طازجة مع كريمة الجبن.", "c3t": "كولد برو", "c3p": "منقوع 24 ساعة يقدم مع الثلج.", "suffix": "", "brand_title": "هوية العلامة", "fonts_label": "الخطوط", "colors_label": "الألوان", "font_roles": "العناوين", "foot": "برو آند بين · قالب Ibra Studio"}};
    var COLORS = [{"hex": "#f5efe8", "en": "Warm latte", "ar": "لاتيه دافئ"}, {"hex": "#6f4e37", "en": "Coffee brown", "ar": "بني القهوة"}, {"hex": "#e6d5c3", "en": "Cream foam", "ar": "رغوة كريمية"}, {"hex": "#7a5c44", "en": "Mocha", "ar": "موكا"}, {"hex": "#ffffff", "en": "White", "ar": "أبيض"}];

    function observeReveal() {
      document.querySelectorAll(".reveal").forEach(function (el) {
        var obs = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (e.isIntersecting) { el.classList.add("visible"); obs.unobserve(el); }
          });
        }, {threshold: 0.1});
        obs.observe(el);
      });
    }
    function paintColorNames(lang) {
      document.querySelectorAll("[data-color-en]").forEach(function (el) {
        el.textContent = lang === "ar" ? el.getAttribute("data-color-ar") : el.getAttribute("data-color-en");
      });
    }
    function applySuffix() {
      var lang = document.documentElement.lang === "ar" ? "ar" : "en";
      var suf = (DICT[lang] && DICT[lang].suffix) || "";
      document.querySelectorAll(".money-price").forEach(function (el) {
        el.setAttribute("data-suffix", suf);
      });
      if (window.IbraMoney) IbraMoney.applyAll();
    }
    var _init = IbraLang.init;
    IbraLang.init = function (dict) {
      _init(dict);
      paintColorNames(document.documentElement.lang === "ar" ? "ar" : "en");
      applySuffix();
      document.querySelectorAll(".lang-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          setTimeout(function () {
            paintColorNames(btn.getAttribute("data-lang"));
            applySuffix();
          }, 0);
        });
      });
    };
    IbraLang.init(DICT);
    document.addEventListener("ibra-currency", applySuffix);
    observeReveal();
  </script>
</body>
