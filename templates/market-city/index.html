<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CityMart Hyper · Ibra Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
:root{--display:'Plus Jakarta Sans';--body:'Inter';--bg:#f0f4f8;--text:#0a1929;--muted:#546e7a;--card:#ffffff;--line:rgba(10,25,41,.08);--accent:#38bdf8;--accent-deep:#0284c7;--accent-bg:rgba(56,189,248,.08);--on-accent:#0a1929;--max:1080px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body),system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
html[dir="rtl"] body{font-family:"IBM Plex Sans Arabic",var(--body),system-ui,sans-serif}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%;height:100%;object-fit:cover}
.wrap{width:min(100% - 2rem,var(--max,1040px));margin:0 auto}

/* topbar */
.topbar{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:.55rem 1rem;background:rgba(240,244,248,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.back{font-size:.85rem;font-weight:600;opacity:.8}
.toggles{display:flex;gap:.45rem;align-items:center;flex-wrap:wrap}
.lang,.currency-toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--accent-bg)}
.lang-btn,.currency-toggle button{border:0;background:transparent;color:var(--muted);padding:.32rem .65rem;cursor:pointer;font-weight:700;font-size:.78rem}
.lang-btn.active,.currency-toggle button.active{background:var(--accent);color:var(--on-accent)}
nav.site{display:flex;justify-content:space-between;align-items:center;padding:1.1rem 0;gap:1rem}
.brand{font-family:var(--display);font-weight:800;font-size:1.3rem;letter-spacing:-.03em;color:var(--accent-deep)}
.nav-links{display:flex;gap:1rem;list-style:none;color:var(--muted);font-size:.9rem;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:.72rem 1.2rem;font-weight:700;font-size:.92rem;border:0;cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn-a{background:var(--accent-deep);color:#fff}
.btn-g{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn-g:hover{background:rgba(2,132,199,.04)}

/* hero with department grid */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:center;padding:2rem 0 1rem}
.hero-text .kicker{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-deep);margin-bottom:.6rem}
.hero-text h1{font-family:var(--display);font-size:clamp(2.2rem,4.5vw,3.2rem);line-height:1.08;letter-spacing:-.03em;margin-bottom:.5rem}
.hero-text h1 span{color:var(--accent-deep)}
.hero-text .lead{color:var(--muted);font-size:.95rem;margin-bottom:1.2rem}
.hero-cta{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:1.4rem}

/* department icon grid */
.dept-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.dept-item{display:flex;flex-direction:column;align-items:center;gap:.3rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.7rem .4rem;cursor:pointer;transition:transform .15s,box-shadow .15s}
.dept-item:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(56,189,248,.12)}
.dept-item .icon{font-size:1.4rem}
.dept-item .name{font-size:.7rem;font-weight:600;color:var(--muted);text-align:center}

.hero-visual{min-height:320px;position:relative;border-radius:18px;overflow:hidden}
.hero-visual img{width:100%;height:320px;object-fit:cover}
.hero-visual::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(56,189,248,.08),transparent)}

/* aisle cards */
.section{padding:1.8rem 0 2.5rem}
.section-head{margin-bottom:1.5rem}
.section-head h2{font-family:var(--display);font-size:clamp(1.4rem,2.5vw,1.8rem);font-weight:700;letter-spacing:-.02em}
.section-head p{color:var(--muted);margin-top:.3rem;font-size:.9rem}

.aisle-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.aisle-card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative;transition:border-color .2s,transform .15s}
.aisle-card:hover{border-color:var(--accent);transform:translateY(-3px)}
.aisle-card .card-img{aspect-ratio:16/11;overflow:hidden}
.aisle-card .card-img img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.aisle-card:hover .card-img img{transform:scale(1.04)}
.aisle-card .card-body{padding:.9rem 1rem 1rem}
.aisle-card .aisle-label{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-deep);margin-bottom:.2rem}
.aisle-card h3{font-family:var(--display);font-size:1.05rem;font-weight:700;letter-spacing:-.02em;margin-bottom:.2rem}
.aisle-card p{color:var(--muted);font-size:.85rem}
.price{font-weight:800;display:block;margin-top:.5rem;color:var(--accent-deep);font-size:1rem}

/* deal badge */
.deal-badge{position:absolute;top:.6rem;right:.6rem;background:var(--accent-deep);color:#fff;font-size:.6rem;font-weight:800;text-transform:uppercase;padding:.2rem .5rem;border-radius:999px;z-index:2;animation:pulse-badge 2s ease-in-out infinite}
@keyframes pulse-badge{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* brand kit */
.brand-kit{margin:1rem 0 2.5rem;padding:1.25rem;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.brand-kit h2{font-family:var(--display);font-size:1.25rem;margin-bottom:.85rem}
.brand-row{margin-bottom:1rem}
.brand-row:last-child{margin-bottom:0}
.brand-label{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:.45rem}
.font-lines{display:grid;gap:.35rem;font-size:.95rem}
.font-lines strong{color:var(--accent-deep)}
.swatches{display:flex;flex-wrap:wrap;gap:.75rem}
.swatch{display:flex;align-items:center;gap:.5rem;min-width:140px}
.swatch-sq{width:28px;height:28px;border-radius:7px;border:1px solid rgba(128,128,128,.25);flex-shrink:0}
.swatch-meta{display:flex;flex-direction:column;line-height:1.25}
.swatch-name{font-size:.82rem;font-weight:600}
.swatch-hex{font-size:.75rem;color:var(--muted);font-family:ui-monospace,monospace}
.footer{border-top:1px solid var(--line);padding:1.3rem 0 2rem;color:var(--muted);font-size:.88rem;display:flex;flex-wrap:wrap;justify-content:space-between;gap:.6rem}

.reveal{opacity:0;transform:translateY(20px);transition:opacity .5s ease,transform .5s ease}
.reveal.visible{opacity:1;transform:translateY(0)}

@media(max-width:800px){
  .hero{grid-template-columns:1fr}
  .hero-visual{min-height:220px;order:-1}
  .hero-visual img{height:220px}
  .dept-grid{grid-template-columns:repeat(3,1fr)}
  .aisle-grid{grid-template-columns:1fr}
  .nav-links{display:none}
}
  </style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="../../index.html" data-i18n="back">← Ibra Studio</a>
    <div class="toggles">
      <div class="lang" aria-label="Language">
        <button type="button" class="lang-btn active" data-lang="en">EN</button>
        <button type="button" class="lang-btn" data-lang="ar">ع</button>
      </div>
      <div class="currency-toggle" aria-label="Currency">
        <button type="button" data-currency="JOD" class="active">JOD</button>
        <button type="button" data-currency="USD">USD</button>
      </div>
    </div>
  </div>
  <div class="wrap">
    <nav class="site">
      <div class="brand">CityMart</div>
      <ul class="nav-links">
        <li data-i18n="nav1"></li>
        <li data-i18n="nav2"></li>
        <li data-i18n="nav3"></li>
      </ul>
      <a class="btn btn-a" href="#" data-i18n="nav4"></a>
    </nav>
  </div>

  <div class="wrap">
    <section class="hero">
      <div class="hero-text">
        <div class="kicker" data-i18n="kicker"></div>
        <h1 data-i18n-html="h1"></h1>
        <p class="lead" data-i18n="lead"></p>
        <div class="hero-cta">
          <a class="btn btn-a" href="#" data-i18n="cta1"></a>
          <a class="btn btn-g" href="#" data-i18n="cta2"></a>
        </div>
        <div class="dept-grid">
          <div class="dept-item"><span class="icon">🛒</span><span class="name" data-i18n="d1"></span></div>
          <div class="dept-item"><span class="icon">👕</span><span class="name" data-i18n="d2"></span></div>
          <div class="dept-item"><span class="icon">🏠</span><span class="name" data-i18n="d3"></span></div>
          <div class="dept-item"><span class="icon">📱</span><span class="name" data-i18n="d4"></span></div>
          <div class="dept-item"><span class="icon">📚</span><span class="name" data-i18n="d5"></span></div>
          <div class="dept-item"><span class="icon">🎮</span><span class="name" data-i18n="d6"></span></div>
        </div>
      </div>
      <div class="hero-visual">
        <img src="../../assets/images/hyper/hero.jpg" alt="CityMart Hyper" />
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2 data-i18n="s_title"></h2>
        <p data-i18n="s_sub"></p>
      </div>
      <div class="aisle-grid">
        <article class="aisle-card reveal">
          <span class="deal-badge" data-i18n="b1"></span>
          <div class="card-img"><img src="../../assets/images/hyper/card1.jpg" alt="" loading="lazy" /></div>
          <div class="card-body"><div class="aisle-label" data-i18n="a1"></div><h3 data-i18n="c1t"></h3><p data-i18n="c1p"></p><span class="price money-price" data-jod="45"></span></div>
        </article>
        <article class="aisle-card reveal">
          <span class="deal-badge" data-i18n="b2"></span>
          <div class="card-img"><img src="../../assets/images/hyper/card2.jpg" alt="" loading="lazy" /></div>
          <div class="card-body"><div class="aisle-label" data-i18n="a2"></div><h3 data-i18n="c2t"></h3><p data-i18n="c2p"></p><span class="price money-price" data-jod="89"></span></div>
        </article>
        <article class="aisle-card reveal">
          <span class="deal-badge" data-i18n="b3"></span>
          <div class="card-img"><img src="../../assets/images/hyper/card3.jpg" alt="" loading="lazy" /></div>
          <div class="card-body"><div class="aisle-label" data-i18n="a3"></div><h3 data-i18n="c3t"></h3><p data-i18n="c3p"></p><span class="price money-price" data-jod="129"></span></div>
        </article>
      </div>
    </section>

    <section class="brand-kit" id="brand-kit">
      <h2><span data-i18n="brand_title">Brand kit</span> · CityMart Hyper</h2>
      <div class="brand-row">
        <div class="brand-label" data-i18n="fonts_label">Fonts</div>
        <div class="font-lines">
          <div><strong>Plus Jakarta Sans</strong> - <span data-i18n="font_roles">Headings</span></div>
          <div><strong>Inter</strong> - body</div>
        </div>
      </div>
      <div class="brand-row">
        <div class="brand-label" data-i18n="colors_label">Colors</div>
        <div class="swatches">
        <div class="swatch"><span class="swatch-sq" style="background:#f0f4f8" title="#f0f4f8"></span><span class="swatch-meta"><span class="swatch-name" data-color-en="Ice blue" data-color-ar="أزرق ثلجي">Ice blue</span><span class="swatch-hex">#f0f4f8</span></span></div>
        <div class="swatch"><span class="swatch-sq" style="background:#38bdf8" title="#38bdf8"></span><span class="swatch-meta"><span class="swatch-name" data-color-en="Sky blue" data-color-ar="أزرق سماوي">Sky blue</span><span class="swatch-hex">#38bdf8</span></span></div>
        <div class="swatch"><span class="swatch-sq" style="background:#0284c7" title="#0284c7"></span><span class="swatch-meta"><span class="swatch-name" data-color-en="Ocean blue" data-color-ar="أزرق محيط">Ocean blue</span><span class="swatch-hex">#0284c7</span></span></div>
        <div class="swatch"><span class="swatch-sq" style="background:#546e7a" title="#546e7a"></span><span class="swatch-meta"><span class="swatch-name" data-color-en="Steel blue" data-color-ar="أزرق فولاذي">Steel blue</span><span class="swatch-hex">#546e7a</span></span></div>
        <div class="swatch"><span class="swatch-sq" style="background:#ffffff" title="#ffffff"></span><span class="swatch-meta"><span class="swatch-name" data-color-en="White" data-color-ar="أبيض">White</span><span class="swatch-hex">#ffffff</span></span></div>
        </div>
      </div>
    </section>
    <footer class="footer">
      <span data-i18n="foot"></span>
      <span>EN · AR · JOD · USD</span>
    </footer>
  </div>
  <script src="../shared/lang.js"></script>
  <script src="../../js/currency.js"></script>
  <script>
    var DICT = {"en": {"back": "← Ibra Studio", "nav1": "Departments", "nav2": "Deals", "nav3": "Locations", "nav4": "Shop now", "kicker": "Hypermarket · Amman", "h1": "Everything under<span>one roof.</span>", "lead": "From groceries to electronics - find what you need at the best price.", "cta1": "Shop departments", "cta2": "Weekly flyer", "d1": "Groceries", "d2": "Fashion", "d3": "Home", "d4": "Electronics", "d5": "Books", "d6": "Toys", "s_title": "Featured deals", "s_sub": "Handpicked offers across every aisle.", "a1": "Electronics", "a2": "Home & Living", "a3": "Fashion", "b1": "-30%", "b2": "-20%", "b3": "-40%", "c1t": "Smart TV 50\"", "c1p": "4K UHD with smart features and voice remote.", "c2t": "Premium Bed Set", "c2p": "600-thread count Egyptian cotton, king size.", "c3t": "Designer Jacket", "c3p": "Limited edition winter collection, all sizes.", "suffix": " JOD", "brand_title": "Brand kit", "fonts_label": "Fonts", "colors_label": "Colors", "font_roles": "Headings", "foot": "CityMart Hyper · Ibra Studio template"}, "ar": {"back": "← Ibra Studio", "nav1": "الأقسام", "nav2": "العروض", "nav3": "الفروع", "nav4": "تسوق الآن", "kicker": "هايبر ماركت · عمّان", "h1": "كل شيء<span>تحت سقف واحد.</span>", "lead": "من البقالة إلى الإلكترونيات - كل ما تحتاجه بأفضل سعر.", "cta1": "تصفح الأقسام", "cta2": "نشرة الأسبوع", "d1": "بقالة", "d2": "أزياء", "d3": "منزل", "d4": "إلكترونيات", "d5": "كتب", "d6": "ألعاب", "s_title": "عروض مميزة", "s_sub": "تخفيضات منتقاة من كل ممر.", "a1": "إلكترونيات", "a2": "منزل ومعيشة", "a3": "أزياء", "b1": "-٣٠٪", "b2": "-٢٠٪", "b3": "-٤٠٪", "c1t": "تلفاز ذكي 50 بوصة", "c1p": "4K UHD مع ميزات ذكية وجهاز تحكم صوتي.", "c2t": "طقم سرير فاخر", "c2p": "قطن مصري 600 خيط، مقاس كينغ.", "c3t": "جاكيت مصمم", "c3p": "إصدار محدود من مجموعة الشتاء، جميع المقاسات.", "suffix": " دينار", "brand_title": "هوية العلامة", "fonts_label": "الخطوط", "colors_label": "الألوان", "font_roles": "العناوين", "foot": "سيتي مارت · قالب Ibra Studio"}};
    var COLORS = [{"hex": "#f0f4f8", "en": "Ice blue", "ar": "أزرق ثلجي"}, {"hex": "#38bdf8", "en": "Sky blue", "ar": "أزرق سماوي"}, {"hex": "#0284c7", "en": "Ocean blue", "ar": "أزرق محيط"}, {"hex": "#546e7a", "en": "Steel blue", "ar": "أزرق فولاذي"}, {"hex": "#ffffff", "en": "White", "ar": "أبيض"}];

    function observeReveal() {
      document.querySelectorAll(".reveal").forEach(function (el) {
        var obs = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (e.isIntersecting) { el.classList.add("visible"); obs.unobserve(el); }
          });
        }, {threshold: 0.1});
        obs.observe(el);
      });
    }
    function paintColorNames(lang) {
      document.querySelectorAll("[data-color-en]").forEach(function (el) {
        el.textContent = lang === "ar" ? el.getAttribute("data-color-ar") : el.getAttribute("data-color-en");
      });
    }
    function applySuffix() {
      var lang = document.documentElement.lang === "ar" ? "ar" : "en";
      var suf = (DICT[lang] && DICT[lang].suffix) || "";
      document.querySelectorAll(".money-price").forEach(function (el) {
        el.setAttribute("data-suffix", suf);
      });
      if (window.IbraMoney) IbraMoney.applyAll();
    }
    var _init = IbraLang.init;
    IbraLang.init = function (dict) {
      _init(dict);
      paintColorNames(document.documentElement.lang === "ar" ? "ar" : "en");
      applySuffix();
      document.querySelectorAll(".lang-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          setTimeout(function () {
            paintColorNames(btn.getAttribute("data-lang"));
            applySuffix();
          }, 0);
        });
      });
    };
    IbraLang.init(DICT);
    document.addEventListener("ibra-currency", applySuffix);
    observeReveal();
  </script>
</body>
</html>
